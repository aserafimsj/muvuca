}

/* Barra de filtros. O sentimento vira pastilha com contagem, como no Zmetrics:
   ver "Negativo 7" sem precisar abrir a lista é metade do trabalho de quem
   cuida de comunidade. O resto fica em listas, que ocupam menos espaço. */
function Filtros({cfg, f, setF, busca, setBusca, naAba, filtrando, aoLimpar}){
  const [abrir, setAbrir] = useState(false);
  const p = (k,v) => setF(prev => ({...prev, [k]: v}));
  const conta = id => naAba.filter(i => String(i.sentimento_id||'') === String(id)).length;
  const juridicos = naAba.filter(i => i.ia_juridico).length;

  // Só os posts que realmente aparecem nesta aba — uma lista com todo post
  // que já existiu seria inútil e enorme.
  const posts = [...new Set(naAba.map(i => i.link_conteudo).filter(Boolean))];

  return (
    <div className="filtros">
      <div className="chips">
        <button className={"chip"+(f.sent===''?' on':'')} onClick={()=>p('sent','')}>
          Todos<span className="n">{naAba.length}</span>
        </button>
        {cfg.sentimentos.map(s=>(
          <button key={s.id} className={"chip"+(f.sent===String(s.id)?' on':'')} onClick={()=>p('sent',String(s.id))}>
            <span className="dot" style={{background:corSent(s.nome)}} />{s.nome}<span className="n">{conta(s.id)}</span>
          </button>
        ))}
        {juridicos > 0 && (
          <button className={"chip juri"+(f.juridico?' on':'')} onClick={()=>p('juridico',!f.juridico)}>
            Jurídico/STN<span className="n">{juridicos}</span>
          </button>
        )}
      </div>

      <div className="filters">
        <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar por autor, texto ou resposta…" />
        <button className="btn" onClick={()=>setAbrir(!abrir)}>{abrir?'Menos filtros':'Mais filtros'}</button>
        {filtrando && <button className="btn" onClick={aoLimpar}>Limpar filtros</button>}
      </div>

      {abrir && (
        <div className="filters">
          <select value={f.iaTriagem} onChange={e=>p('iaTriagem',e.target.value)}>
            <option value="">IA sugeriu: tudo</option>
            <option value="responder">IA: responder</option>
            <option value="curtir">IA: só curtir</option>
            <option value="nao_responder">IA: não responder</option>
          </select>
          <select value={f.origem} onChange={e=>p('origem',e.target.value)}>
            <option value="">Origem: todas</option><option>Feed</option><option>DM</option>
          </select>
          <select value={f.rede} onChange={e=>p('rede',e.target.value)}>
            <option value="">Rede: todas</option>
            {cfg.redes.map(r=><option key={r.id} value={String(r.id)}>{r.nome}</option>)}
          </select>
          <select value={f.produto} onChange={e=>p('produto',e.target.value)}>
            <option value="">Produto: todos</option>
            {cfg.produtos.map(pp=><option key={pp.id} value={String(pp.id)}>{pp.nome}</option>)}
          </select>
          <select value={f.editoria} onChange={e=>p('editoria',e.target.value)}>
            <option value="">Editoria: todas</option>
            {cfg.editorias.map(ed=><option key={ed.id} value={String(ed.id)}>{ed.nome}</option>)}
          </select>
          {posts.length > 0 && (
            <select value={f.post} onChange={e=>p('post',e.target.value)}>
              <option value="">Post: todos</option>
              {posts.map(u=><option key={u} value={u}>{rotuloPost(u)}</option>)}
            </select>
          )}
          <label className="dedata">de<input type="date" value={f.de} onChange={e=>p('de',e.target.value)} /></label>
          <label className="dedata">até<input type="date" value={f.ate} onChange={e=>p('ate',e.target.value)} /></label>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   DASHBOARD
   Barras horizontais em vez de pizza: o trabalho aqui é comparar tamanhos, e
   comparar ângulo é mais difícil que comparar comprimento. O número fica
   sempre visível ao lado — as cores de sentimento do MUVUCA são claras demais
   contra o branco para carregarem sozinhas a informação.
   ============================================================ */
const COR_BARRA = '#8A6516';   // âmbar escuro: família do MUVUCA e legível no branco

function Barras({dados, total, corDe}){
  const maior = Math.max(1, ...dados.map(d => d.n));
  return (
    <div className="barras">
      {dados.map(d => {
        const pct = total ? Math.round(d.n/total*100) : 0;
        return (
          <div key={d.nome} className="barra" title={`${d.nome}: ${d.n} de ${total} (${pct}%)`}>
            <div className="rot">{d.nome}</div>
            <div className="trilho">
              <div className="preenche" style={{width: Math.max(2, d.n/maior*100)+'%', background: corDe ? corDe(d.nome) : COR_BARRA}} />
            </div>
            <div className="num">{d.n}<span className="pct">{pct}%</span></div>
          </div>
        );
      })}
    </div>
  );
}

function Tabela({dados, total}){
  return (
    <table className="tabnum">
      <thead><tr><th>Item</th><th>Comentários</th><th>%</th></tr></thead>
      <tbody>
        {dados.map(d => (
          <tr key={d.nome}><td>{d.nome}</td><td>{d.n}</td><td>{total?Math.round(d.n/total*100):0}%</td></tr>
        ))}
      </tbody>
    </table>
  );
}

/* Barras em pé, com eixo e grade — o desenho padrão do Zmetrics.
   O número vai em cima de cada barra: é o reforço que o teste de cor exige,
   já que o pior par da paleta fica na faixa em que a cor sozinha não basta. */
function BarrasV({dados, corDe}){
  const [sob, setSob] = useState(null);
  const L=34, R=8, T=20, B=40, W=340, H=225;
  const maior = topoDoEixo(Math.max(1, ...dados.map(d=>d.n)));
  const faixa = (W-L-R) / dados.length;
  const larg = Math.max(6, Math.min(52, faixa - 8));   // 8px de respiro entre barras
  const y = v => T + (H-T-B) * (1 - v/maior);
  const cx = k => L + faixa*k + faixa/2;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="svgraf" role="img"
      aria-label={dados.map(d=>`${d.nome}: ${d.n}`).join(', ')}>
      {[0,.5,1].map(f=>(
        <g key={f}>
          <line x1={L} x2={W-R} y1={y(maior*f)} y2={y(maior*f)} className="gradelinha" />
          <text x={L-5} y={y(maior*f)+3.5} className="eixotxt" textAnchor="end">{Math.round(maior*f)}</text>
        </g>
      ))}
      {dados.map((d,k)=>(
        <g key={d.nome} onMouseEnter={()=>setSob(k)} onMouseLeave={()=>setSob(null)}>
          <rect x={cx(k)-faixa/2} y={T} width={faixa} height={H-T-B} fill="transparent" />
          <rect x={cx(k)-larg/2} y={y(d.n)} width={larg} height={Math.max(1,(H-B)-y(d.n))}
            rx="4" fill={corDe(d.nome)} opacity={sob===null||sob===k?1:.45} />
          <text x={cx(k)} y={y(d.n)-5} className="valtxt" textAnchor="middle">{d.n}</text>
          <text x={cx(k)} y={H-B+13} className="eixotxt" textAnchor="middle">{cortar(d.nome, Math.floor(faixa/6))}</text>
        </g>
      ))}
    </svg>
  );
}

// Corta nome comprido para caber embaixo da barra sem encavalar no vizinho.
const cortar = (s, n) => { s = String(s); return s.length <= n ? s : s.slice(0, Math.max(1,n-1)) + '…'; };

function Pizza({dados, total, corDe}){
  const [sob, setSob] = useState(null);
  const W=340, H=225, cx=W/2, cy=100, r=76;
  const soma = dados.reduce((a,d)=>a+d.n, 0) || 1;
  let ang = -Math.PI/2;
  const fatias = dados.map(d => {
    const a0 = ang, a1 = ang + (d.n/soma)*Math.PI*2;
    ang = a1;
    return {...d, a0, a1};
  });
  const ponto = (a, raio) => [cx + Math.cos(a)*raio, cy + Math.sin(a)*raio];

  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} className="svgraf" role="img"
        aria-label={dados.map(d=>`${d.nome}: ${d.n}`).join(', ')}>
        {fatias.map((f,k) => {
          // Uma categoria só vira círculo inteiro: o arco de 360° degenera
          // (começo e fim no mesmo ponto) e não desenharia nada.
          if(dados.length === 1) return <circle key={f.nome} cx={cx} cy={cy} r={r} fill={corDe(f.nome)} />;
          const [x0,y0] = ponto(f.a0, r), [x1,y1] = ponto(f.a1, r);
          const grande = (f.a1 - f.a0) > Math.PI ? 1 : 0;
          const meio = (f.a0+f.a1)/2;
          const [tx,ty] = ponto(meio, r*0.62);
          const pct = Math.round(f.n/soma*100);
          return (
            <g key={f.nome} onMouseEnter={()=>setSob(k)} onMouseLeave={()=>setSob(null)}>
              <path d={`M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${grande} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z`}
                fill={corDe(f.nome)} stroke="#fff" strokeWidth="2" opacity={sob===null||sob===k?1:.45} />
              {pct >= 8 && <text x={tx} y={ty+4} className="fatiatxt" textAnchor="middle">{pct}%</text>}
            </g>
          );
        })}
      </svg>
      <div className="legenda">
        {dados.map((d,k)=>(
          <span key={d.nome} className="litem" style={{opacity: sob===null||sob===k?1:.5}}>
            <span className="ldot" style={{background:corDe(d.nome)}} />{d.nome}
            <b>{d.n}</b><span className="lpct">{Math.round(d.n/soma*100)}%</span>
          </span>
        ))}
      </div>
    </div>
  );
}

function Empilhado({cruz, corSerie}){
  const [sob, setSob] = useState(null);
  const L=34, R=8, T=20, B=40, W=340, H=225;
  const maior = topoDoEixo(Math.max(1, ...cruz.linhas.map(l=>l.soma)));
  const faixa = (W-L-R) / Math.max(1, cruz.linhas.length);
  const larg = Math.max(6, Math.min(52, faixa - 8));
  const esc = v => (H-T-B) * (v/maior);
  const cx = k => L + faixa*k + faixa/2;

  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} className="svgraf" role="img"
        aria-label={cruz.linhas.map(l=>`${l.nome}: ${l.soma}`).join(', ')}>
        {[0,.5,1].map(f=>(
          <g key={f}>
            <line x1={L} x2={W-R} y1={T+(H-T-B)*(1-f)} y2={T+(H-T-B)*(1-f)} className="gradelinha" />
            <text x={L-5} y={T+(H-T-B)*(1-f)+3.5} className="eixotxt" textAnchor="end">{Math.round(maior*f)}</text>
          </g>
        ))}
        {cruz.linhas.map((l,k)=>{
          let base = H-B;
          return (
            <g key={l.nome} onMouseEnter={()=>setSob(k)} onMouseLeave={()=>setSob(null)}>
              {cruz.series.map(s => {
                const h = esc(l.fatias[s]);
                if(h <= 0) return null;
                base -= h;
                // 2px de folga entre as fatias: sem isso duas cores vizinhas
                // parecem uma só mancha.
                return <rect key={s} x={cx(k)-larg/2} y={base} width={larg} height={Math.max(1,h-2)}
                  rx="2" fill={corSerie(s)} opacity={sob===null||sob===k?1:.45}>
                  <title>{`${l.nome} · ${s}: ${l.fatias[s]}`}</title>
                </rect>;
              })}
              <text x={cx(k)} y={base-5} className="valtxt" textAnchor="middle">{l.soma}</text>
              <text x={cx(k)} y={H-B+13} className="eixotxt" textAnchor="middle">{cortar(l.nome, Math.floor(faixa/6))}</text>
            </g>
          );
        })}
      </svg>
      <div className="legenda">
        {cruz.series.map(s=>(
          <span key={s} className="litem"><span className="ldot" style={{background:corSerie(s)}} />{s}</span>
        ))}
      </div>
    </div>
  );
}

const TIPOS = [['pizza','Pizza'],['barras','Barras'],['barrasH','Barras H'],['empilhado','Empilhado']];

function Bloco({titulo, dados, total, corDe, tabela, nota, cruz, corSerie, padrao='barras'}){
  const [tipo, setTipo] = useState(padrao);
  return (
    <div className="bloco">
      <div className="bcab">
        <div className="btit">{titulo}</div>
        {!tabela && dados.length > 0 && (
          <div className="segs">
            {TIPOS.map(([k,l])=>(
              <button key={k} className={"seg"+(tipo===k?' on':'')} onClick={()=>setTipo(k)}
                disabled={k==='empilhado' && !cruz}>{l}</button>
            ))}
          </div>
        )}
      </div>
      {nota && <div className="bnota">{nota}</div>}
      {dados.length === 0
        ? <div className="bvazio">Nada preenchido neste período.</div>

  );
}

/* Linha do tempo em SVG. Sem biblioteca de gráfico: o MUVUCA é uma página só,
   sem compilação, e puxar uma biblioteca de fora para desenhar uma linha
   custaria mais do que desenhá-la. */
function LinhaTempo({dias, series, corDe}){
  const [sob, setSob] = useState(null);
  if(dias.length < 2) return <div className="bvazio">Poucos dias com data para desenhar uma linha. Preencha a data dos comentários.</div>;

  const L=40, R=12, T=12, B=26, W=760, H=190;
  // Um eixo só para todas as linhas: dois eixos no mesmo gráfico fazem séries
  // de tamanhos diferentes parecerem equivalentes.
  const maior = topoDoEixo(Math.max(1, ...series.flatMap(s => s.valores)));
  const x = k => L + (W-L-R) * (dias.length===1 ? 0 : k/(dias.length-1));
  const y = v => T + (H-T-B) * (1 - v/maior);
  const caminho = vals => vals.map((v,k)=>`${k?'L':'M'}${x(k).toFixed(1)},${y(v).toFixed(1)}`).join(' ');

  // Três marcas no eixo de baixo: começo, meio e fim. Mais do que isso vira
  // amontoado ilegível em período longo.
  const marcas = [0, Math.floor((dias.length-1)/2), dias.length-1].filter((v,i,a)=>a.indexOf(v)===i);

  return (
    <div className="linhatempo">
      <svg viewBox={`0 0 ${W} ${H}`} className="svgtempo" role="img"
        aria-label={`Comentários por dia, de ${dias[0]} a ${dias[dias.length-1]}`}
        onMouseLeave={()=>setSob(null)}
        onMouseMove={e=>{
          const c = e.currentTarget.getBoundingClientRect();
          const px = (e.clientX - c.left) / c.width * W;
          const k = Math.round((px - L) / Math.max(1,(W-L-R)) * (dias.length-1));
          setSob(k>=0 && k<dias.length ? k : null);
        }}>
        {[0, .5, 1].map(f=>(
          <g key={f}>
            <line x1={L} x2={W-R} y1={y(maior*f)} y2={y(maior*f)} className="gradelinha" />
            <text x={L-6} y={y(maior*f)+4} className="eixotxt" textAnchor="end">{Math.round(maior*f)}</text>
          </g>
        ))}
        {series.map(s=>(
          <path key={s.nome} d={caminho(s.valores)} className="serie"
            style={corDe ? {stroke: corDe(s.nome)} : null} />
        ))}
        {sob !== null && (
          <g>
            <line x1={x(sob)} x2={x(sob)} y1={T} y2={H-B} className="cruz" />
            {series.map(s=>(
              <circle key={s.nome} cx={x(sob)} cy={y(s.valores[sob])} r="5" className="ponto"
                style={corDe ? {fill: corDe(s.nome)} : null} />
            ))}
          </g>
        )}
        {marcas.map(k=>(
          <text key={k} x={x(k)} y={H-8} className="eixotxt"
            textAnchor={k===0?'start':k===dias.length-1?'end':'middle'}>
            {fmtBR(dataLocal(dias[k]))}
          </text>
        ))}
      </svg>
      {series.length > 1 && (
        <div className="legenda">
          {series.map(s=>(
            <span key={s.nome} className="litem">
              <span className="ldot" style={{background: corDe ? corDe(s.nome) : '#8A6516'}} />{s.nome}
            </span>
          ))}
        </div>
      )}
      <div className="dicatempo">
        {sob !== null
          ? <span>{fmtBR(dataLocal(dias[sob]))}: {series.map(s=>`${s.nome==='total'?'':s.nome+' '}${s.valores[sob]}`).join(' · ')}</span>
          : <span>Passe o mouse sobre a linha para ver o número de cada dia.</span>}
      </div>
    </div>
  );
}

function Dashboard({cfg, interacoes, clienteNome}){
  const [periodo, setPeriodo] = useState('total');
  const [de, setDe] = useState('');
  const [ate, setAte] = useState('');
  const [tabela, setTabela] = useState(false);

  const {de:d0, ate:d1} = resolvePeriodo(periodo, de, ate);
  const vivos = interacoes.filter(i => !naLixeira(i));
  const itens = vivos.filter(i => noPeriodo(i, periodo, d0, d1));

  const nomePor = (lista, id) => lista.find(x => x.id === id)?.nome || null;
  const sentDe  = i => nomePor(cfg.sentimentos, i.sentimento_id);

  const [linhaPor, setLinhaPor] = useState('total');

  const redeDe = i => nomePor(cfg.redes, i.rede_id);
  const porSent = contarPor(itens, sentDe, 'Sem sentimento');
  const porRede = contarPor(itens, redeDe, 'Sem rede');
  const porProd = contarPor(itens, i => nomePor(cfg.produtos, i.produto_id));
  const porEdit = contarPor(itens, i => nomePor(cfg.editorias, i.editoria_id));
  const porAutor = contarPor(itens, i => i.autor).slice(0, 10);

  // "Empilhado" cruza por rede, como no Zmetrics.
  const cruzSent = cruzarPor(itens, sentDe, redeDe, 'Sem sentimento');
  const cruzProd = cruzarPor(itens, i => nomePor(cfg.produtos, i.produto_id), redeDe);
  const cruzEdit = cruzarPor(itens, i => nomePor(cfg.editorias, i.editoria_id), redeDe);
  const cruzRede = cruzarPor(itens, redeDe, sentDe, 'Sem rede');

  // Sentimento tem cor própria, definida por você nas configurações. Rede,
  // produto e editoria não têm, então recebem cores de uma paleta fixa.
  const corSentimento = nome => corSent(nome);
  const corRede = corDaLista(cfg.redes.map(r=>r.nome).concat('Sem rede'));
  const corProd = corDaLista(cfg.produtos.map(p=>p.nome));
  const corEdit = corDaLista(cfg.editorias.map(e=>e.nome));
  const corAutor = corDaLista(porAutor.map(a=>a.nome));

  const serieTotal = serieDiaria(itens);
  const serieSent = serieDiariaPor(itens, sentDe);
  const linhaDias = linhaPor === 'total' ? serieTotal.map(p=>p.dia) : serieSent.dias;
  const linhaSeries = linhaPor === 'total'
    ? [{nome:'total', valores: serieTotal.map(p=>p.n)}]
    : serieSent.series;

  const respondidos = itens.filter(i => i.triagem === 'Respondido').length;
  const pendentes   = itens.filter(i => (i.triagem||'Pendente') === 'Pendente').length;
  const juridicos   = itens.filter(i => i.ia_juridico).length;
  const semData     = itens.filter(i => !dataDoComentario(i)).length;

  return (
    <div>
      <div className="head">

  );

/* ============================================================
   EVOLUÇÃO DIÁRIA
   Primeiro módulo analítico de verdade. Barras empilhadas por sentimento, uma
   por dia, com o total escrito em cima — e, ao clicar num dia, a lista dos
   comentários daquele dia. O gráfico responde "quando", a lista responde
   "o quê": número sem poder ver o que há por trás dele não resolve nada.
   ============================================================ */
const MOSTRA_DE_INICIO = 8;

function BarrasDia({dias, series, totais, corDe, escolhido, aoEscolher}){
  const L=44, R=10, T=26, B=46, W=1000, H=330;
  const maior = topoDoEixo(Math.max(1, ...totais));
  const faixa = (W-L-R) / Math.max(1, dias.length);
  const larg = Math.max(3, Math.min(34, faixa - 6));
  const esc = v => (H-T-B) * (v/maior);
  const cx = k => L + faixa*k + faixa/2;

  /* Com 30 dias cabe uma data em cada barra; com 90, não cabe. Mostra uma a
     cada N para os rótulos não virarem uma mancha preta ilegível. */
  const passo = Math.ceil(dias.length / 22);
  const curto = d => { const x = dataLocal(d); return x ? `${String(x.getDate()).padStart(2,'0')}/${String(x.getMonth()+1).padStart(2,'0')}` : d; };

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="svgraf" role="img"
      aria-label={`Comentários por dia, de ${dias[0]} a ${dias[dias.length-1]}`}>
      {[0,.5,1].map(f=>(
        <g key={f}>
          <line x1={L} x2={W-R} y1={T+(H-T-B)*(1-f)} y2={T+(H-T-B)*(1-f)} className="gradelinha" />
          <text x={L-6} y={T+(H-T-B)*(1-f)+3.5} className="eixotxt" textAnchor="end">{Math.round(maior*f)}</text>
        </g>
      ))}
      {dias.map((dia,k)=>{
        let base = H-B;
        const total = totais[k];
        const on = escolhido === dia;
        return (
          <g key={dia} className="colunadia" onClick={()=>aoEscolher(on ? null : dia)}>
            {/* Área de clique da coluna inteira: acertar uma barra de 3px de
                largura com o mouse é tarefa para ninguém. */}
            <rect x={cx(k)-faixa/2} y={T-14} width={faixa} height={H-T-B+14}
              fill={on ? 'rgba(245,179,1,.14)' : 'transparent'} />
            {series.map(s=>{
              const h = esc(s.valores[k]);
              if(h <= 0) return null;
              base -= h;
              return <rect key={s.nome} x={cx(k)-larg/2} y={base} width={larg}
                height={Math.max(1, h - (h > 3 ? 1.5 : 0))} fill={corDe(s.nome)}
                // Apagar as outras colunas a 40% tirava a leitura do conjunto;
                // o fundo amarelo já marca qual foi escolhida.
                opacity={escolhido && !on ? .62 : 1}>
                <title>{`${curto(dia)} · ${s.nome}: ${s.valores[k]}`}</title>
              </rect>;
            })}
            {total > 0 && <text x={cx(k)} y={base-6} className="valtxt" textAnchor="middle">{total}</text>}
            {(k % passo === 0 || k === dias.length-1) && (
              <text x={cx(k)} y={H-B+16} className="eixotxt" textAnchor="middle"
                transform={passo === 1 && faixa < 26 ? `rotate(-45 ${cx(k)} ${H-B+16})` : ''}>{curto(dia)}</text>
            )}
          </g>
        );
      })}
    </svg>
  );
}

function EvolucaoDiaria({cfg, interacoes, cliente, rede}){
  const [periodo, setPeriodo] = useState('28d');
  const [de, setDe] = useState('');
  const [ate, setAte] = useState('');
  const [dia, setDia] = useState(null);
  const [mostrar, setMostrar] = useState(MOSTRA_DE_INICIO);

  const {de:d0, ate:d1} = resolvePeriodo(periodo, de, ate);
  const nomeSent = i => cfg.sentimentos.find(s => s.id === i.sentimento_id)?.nome || null;

  // Recorte: este cliente, esta rede, fora da lixeira, dentro do período.
  const daRede = interacoes.filter(i => !naLixeira(i) && i.rede_id === rede.id);
  const itens  = daRede.filter(i => noPeriodo(i, periodo, d0, d1));
  const semData = daRede.filter(i => !dataDoComentario(i)).length;

  const {dias, series, totais} = serieDiariaPor(itens, nomeSent, 'Sem sentimento');
  const corDe = nome => corSent(nome);
  const total = totais.reduce((a,n)=>a+n, 0);

  const doDiaEscolhido = dia ? doDia(itens, dia) : [];
  useEffect(()=>{ setMostrar(MOSTRA_DE_INICIO); }, [dia]);

  return (
    <div>
      <div className="head">
        <div>
          <h1>Evolução Diária</h1>
          <p>{cliente?.nome} · {rede?.nome}</p>
        </div>
      </div>

      <div className="periodo">
        <label className="campo" style={{flex:'0 1 200px'}}><span>Período</span>
          <select value={periodo} onChange={e=>{setPeriodo(e.target.value); setDia(null);}}>
            {PERIODOS.map(([k,l])=><option key={k} value={k}>{l}</option>)}
          </select>
        </label>
        {periodo === 'custom' && (
          <>
            <label className="campo" style={{flex:'0 1 150px'}}><span>De</span>
              <input type="date" value={de} onChange={e=>{setDe(e.target.value); setDia(null);}} /></label>
            <label className="campo" style={{flex:'0 1 150px'}}><span>Até</span>
              <input type="date" value={ate} onChange={e=>{setAte(e.target.value); setDia(null);}} /></label>
          </>
        )}
        <div className="resumoper">
          <div className="quando">{periodo==='total' ? 'Todo o período' : `${fmtBR(d0)} — ${fmtBR(d1)}`}</div>
          <div className="quantos"><b>{total.toLocaleString('pt-BR')}</b> comentário(s) em {dias.length} dia(s)</div>
        </div>
      </div>

      {/* A linha de filtros ativos, como na referência: quem olha o gráfico
          precisa saber de que recorte ele veio, sem ter de deduzir. */}
      <div className="filtrosativos">
        <b>FILTROS ATIVOS</b>{' '}
        {cliente?.nome} · {rede?.nome} · {periodo==='total' ? 'todo o período' : `${fmtBR(d0)} até ${fmtBR(d1)}`} ·{' '}
        {total.toLocaleString('pt-BR')} comentário(s) ·{' '}
        {series.map(s => `${s.nome}: ${s.valores.reduce((a,n)=>a+n,0)}`).join(' · ') || 'sem classificação'}
        {semData > 0 && <> · <span className="alerta">{semData} sem data, fora deste gráfico</span></>}
      </div>

      {dias.length === 0 ? (
        <div className="empty">
          Nenhum comentário deste canal neste período.
          {semData > 0 && <> Há {semData} comentário(s) sem data de publicação — eles não entram em recorte por período. Preencha a data no cartão, em Community.</>}
        </div>
      ) : (
        <>
          <div className="bloco">
            <BarrasDia dias={dias} series={series} totais={totais} corDe={corDe}
              escolhido={dia} aoEscolher={setDia} />
            <div className="legenda">
              {series.map(s=>(
                <span key={s.nome} className="litem">
                  <span className="ldot" style={{background:corDe(s.nome)}} />{s.nome}
                  <b>{s.valores.reduce((a,n)=>a+n,0)}</b>
                </span>
              ))}
              <span className="litem" style={{marginLeft:'auto',color:'var(--muted)'}}>
                {dia ? 'Clique de novo na barra para fechar o detalhamento.' : 'Clique numa barra para ver os comentários do dia.'}
              </span>
            </div>
          </div>

          {dia && (
            <div className="bloco" style={{marginTop:14}}>
              <div className="bcab">
                <div className="btit">{fmtBR(dataLocal(dia))}</div>
                <div className="bnota" style={{margin:0}}>{doDiaEscolhido.length} comentário(s)</div>
              </div>
              {doDiaEscolhido.slice(0, mostrar).map(i=>(
                <div key={i.id} className="detlinha">
                  <span className="detautor">{i.autor ? '@'+String(i.autor).replace(/^@/,'') : 'sem @'}</span>
                  <span className="dettexto">{i.texto}</span>
                  <span className="detsent">
                    <span className="ldot" style={{background:corSent(nomeSent(i))}} />
                    {nomeSent(i) || 'Sem sentimento'}
                  </span>
                </div>
              ))}
              {doDiaEscolhido.length > mostrar && (
                <div style={{textAlign:'center',marginTop:10}}>
                  <button className="btn" onClick={()=>setMostrar(doDiaEscolhido.length)}>
                    Ver todos os {doDiaEscolhido.length}
                  </button>
                </div>
              )}
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* ============================================================
   CONTEÚDOS
   O mural de publicações. No Zmetrics é um cadastro manual — você cola o link
   de cada post — porque lá não existe importação. Aqui não se cadastra nada:
   as publicações já chegam pela planilha, com link, formato, rede, data e as
   métricas. Um segundo cadastro ao lado criaria post repetido, já que nada
   impediria a mesma publicação de entrar pelos dois caminhos.
   ============================================================ */
const METRICAS = [
  ['visu','Visualizações'], ['curtidas','Curtidas'], ['coment','Comentários'],
  ['compart','Compart.'], ['salvos','Salvamentos'],
];
const POR_PAGINA = 12;

function Conteudos({cfg, publicacoes, interacoes, clienteNome}){
  const [fRede, setFRede] = useState('');
  const [busca, setBusca] = useState('');
  const [quantos, setQuantos] = useState(POR_PAGINA);

  const vivos = interacoes.filter(i => !naLixeira(i));
  const nomeRede = id => cfg.redes.find(r => r.id === id)?.nome || null;

  const lista = publicacoes.filter(p => {
    if(fRede && String(p.rede_id) !== fRede) return false;
    if(busca){
      const q = busca.toLowerCase();
      const alvo = `${p.link || ''} ${p.formato || ''} ${nomeRede(p.rede_id) || ''}`.toLowerCase();
      if(!alvo.includes(q)) return false;
    }
    return true;
  });
  const mostrando = lista.slice(0, quantos);

  // Quantos comentários vieram de cada post. A lixeira não conta.
  const comentariosDe = p => vivos.filter(i => mesmoPost(i.link_conteudo, p.link)).length;
  // Comentários que apontam para um post que não está na lista de publicações.
  const orfaos = vivos.filter(i => i.link_conteudo &&
    !publicacoes.some(p => mesmoPost(i.link_conteudo, p.link))).length;

  return (
    <div>
      <div className="head">
        <div><h1>Conteúdos</h1><p>{clienteNome} · {publicacoes.length} publicação(ões) importada(s)</p></div>
      </div>

      {publicacoes.length === 0 ? (
        <div className="empty">
          Nenhuma publicação importada ainda. As publicações entram pela planilha,
          em <b>Importar dados</b> — nas abas cujo nome começa com "Resultados".
        </div>
      ) : (
        <>
          <div className="filters">
            <input value={busca} onChange={e=>{setBusca(e.target.value); setQuantos(POR_PAGINA);}}
              placeholder="Buscar por link, formato ou rede…" />
            <select value={fRede} onChange={e=>{setFRede(e.target.value); setQuantos(POR_PAGINA);}}>
              <option value="">Rede: todas</option>
              {cfg.redes.map(r=><option key={r.id} value={String(r.id)}>{r.nome}</option>)}
            </select>
          </div>

          {orfaos > 0 && (
            <div className="aviso">{orfaos} comentário(s) apontam para um post que não está entre as
            publicações importadas. Eles continuam no Community normalmente — só não aparecem ligados
            a nenhum cartão aqui.</div>
          )}

          {mostrando.length === 0 ? (
            <div className="empty">Nenhuma publicação corresponde ao que você filtrou.</div>
          ) : (
            <div className="mural">
              {mostrando.map(p => {
                const incorporar = embedDoPost(p.link);
                const n = comentariosDe(p);
                const rede = nomeRede(p.rede_id) || redeDoLink(p.link);
                return (
                  <div key={p.id} className="post">
                    <div className="pcab">
                      {rede && <span className="prede">{rede}</span>}
                      {p.formato && <span className="tag">{p.formato}</span>}
                      {p.data_post && <span className="pdata">{fmtBR(dataLocal(p.data_post))}</span>}
                    </div>

                    {incorporar
                      ? <iframe src={incorporar} title={p.link || 'publicação'} loading="lazy"
                          scrolling="no" className="pembed" />
                      : <div className="psemembed">
                          Este link não pode ser mostrado aqui dentro. Use <b>abrir ↗</b>.
                        </div>}

                    <div className="pnums">
                      {METRICAS.map(([campo, rotulo]) => {
                        const v = metrica(p, campo);
                        return v === null ? null : (
                          <span key={campo}><b>{v.toLocaleString('pt-BR')}</b>{rotulo}</span>
                        );
                      })}
                    </div>

                    <div className="ppe">
                      <span className={n ? 'temcom' : ''}>{n} comentário(s) deste post</span>
                      {p.link && <a href={p.link} target="_blank" rel="noopener noreferrer">abrir ↗</a>}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {lista.length > mostrando.length && (
            <div style={{textAlign:'center',marginTop:16}}>
              <button className="btn" onClick={()=>setQuantos(q => q + POR_PAGINA)}>
                Mostrar mais {Math.min(POR_PAGINA, lista.length - mostrando.length)} de {lista.length - mostrando.length}
              </button>
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* ============================================================
   APROVAÇÃO DE CONTEÚDO — etapa 1: a fundação

   A peça de conteúdo ANTES de ir ao ar. Não confundir com a tela
   "Conteúdos", que mostra o post JÁ PUBLICADO com os números dele — são
   duas coisas diferentes e moram em tabelas diferentes de propósito. A
   ligação entre elas (`conteudos.publicacao_id`) só é preenchida depois
   que a peça é publicada, e é isso que evita dois registros do mesmo post.

   Nesta etapa: cadastrar, organizar por mês, mover o status e guardar o
   histórico. Arquivos, prévia e portal do cliente vêm nas etapas seguintes.
   ============================================================ */

/* Os estados da peça, na ordem em que a vida acontece. "ordem" serve para
   ordenar a lista por andamento, não para impedir caminho — a realidade
   volta atrás com frequência. */
const APROV_STATUS = {
  rascunho:          {rotulo:'Rascunho',               cor:'#8A8F98', ordem:1},
  em_revisao:        {rotulo:'Em revisão interna',     cor:'#B5852A', ordem:2},
  enviado:           {rotulo:'Enviado para aprovação', cor:'#185FA5', ordem:3},
  visualizado:       {rotulo:'Visualizado',            cor:'#5B8DEF', ordem:4},
  aprovado:          {rotulo:'Aprovado',               cor:'#1E9E6A', ordem:5},
  ajuste_solicitado: {rotulo:'Ajuste solicitado',      cor:'#E63329', ordem:6},
  em_alteracao:      {rotulo:'Em alteração',           cor:'#F5A623', ordem:7},
  reenviado:         {rotulo:'Reenviado',              cor:'#185FA5', ordem:8},
};

/* Para onde cada estado pode ir, com que palavra no botão, e qual é o
   caminho PRINCIPAL — o que leva a peça adiante rumo à aprovação. Só o
   principal ganha o botão verde.

   O destaque é marcado à mão, e não deduzido da ordem dos estados, porque
   "ajuste solicitado" e "em alteração" vêm DEPOIS de "aprovado" na lista
   (é a ordem em que a vida acontece) sem serem um avanço. Deduzindo pela
   ordem, "Reabrir para alteração" numa peça já aprovada virava o botão
   verde em destaque — convidando a desfazer uma aprovação pronta.

   O caminho de volta existe sempre: engano de clique não pode virar
   trabalho perdido. Ele só nunca é o botão em destaque. */
const APROV_CAMINHOS = {
  rascunho:          [['em_revisao','Mandar para revisão interna', true]],
  em_revisao:        [['enviado','Enviar para aprovação', true], ['rascunho','Voltar para rascunho']],
  enviado:           [['aprovado','O cliente aprovou', true], ['visualizado','O cliente viu'],
                      ['ajuste_solicitado','O cliente pediu ajuste'], ['em_revisao','Cancelar o envio']],
  visualizado:       [['aprovado','O cliente aprovou', true], ['ajuste_solicitado','O cliente pediu ajuste'],
                      ['em_revisao','Cancelar o envio']],
  // Peça aprovada não tem "próximo passo". Reabrir é exceção, não rotina.
  aprovado:          [['em_alteracao','Reabrir para alteração']],
  ajuste_solicitado: [['em_alteracao','Começar a alteração', true]],
  em_alteracao:      [['reenviado','Reenviar para aprovação', true], ['em_revisao','Voltar para revisão interna']],
  reenviado:         [['aprovado','O cliente aprovou', true], ['ajuste_solicitado','O cliente pediu ajuste'],
                      ['visualizado','O cliente viu'], ['em_alteracao','Voltar para alteração']],
};

/* Formato é diferente de rede: o mesmo Carrossel existe no Instagram e no
   Facebook. A rede vem da tabela `redes` do cliente; o formato é esta lista
   fixa, porque ela define qual prévia será montada nas etapas 3 e 4. */
const APROV_FORMATOS = ['Feed', 'Carrossel', 'Reels', 'Stories', 'Vídeo', 'Texto', 'Link'];

// Estados que contam como "o cliente ainda tem que responder".
const APROV_AGUARDANDO = ['enviado', 'visualizado', 'reenviado'];
// Estados que contam como "voltou com pedido".
const APROV_EM_AJUSTE  = ['ajuste_solicitado', 'em_alteracao'];

const APROV_FILTRO_VAZIO = {rede:'', formato:'', status:'', editoria:'', produto:'', busca:''};

/* ---------- ARQUIVOS (etapa 2) ----------
   A área de arquivos do Supabase nasce FECHADA (ver MIGRACAO-ARQUIVOS.md):
   arte não publicada é material sob embargo, e área aberta significaria que
   qualquer um com o endereço veria a campanha antes da hora. Por isso cada
   imagem precisa de uma "chave de visita" temporária, pedida na hora. */
const ARQ_BALDE = 'conteudos';
const ARQ_LIMITE = 50 * 1024 * 1024;          // 50 MB, o mesmo limite do balde
const ARQ_ESPACO_TOTAL = 1024 * 1024 * 1024;  // 1 GB do plano gratuito
const ARQ_AVISAR_EM = 0.8;                    // avisa a partir de 80% cheio
const ARQ_VALIDADE = 3600;                    // a chave de visita vale 1 hora

const ARQ_TIPOS = {
  'image/jpeg':'imagem', 'image/png':'imagem', 'image/webp':'imagem', 'image/gif':'imagem',
  'video/mp4':'video', 'video/quicktime':'video', 'video/webm':'video',
};

/* Puras e fora do componente, para poderem ser testadas sem navegador. */

// "1,4 MB". Numero cru em byte nao diz nada para quem olha.
function tamanhoLegivel(bytes){
  const n = Number(bytes);
  if(!n || n < 0) return '—';
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(0) + ' KB';
  if(n < 1024*1024*1024) return (n/(1024*1024)).toFixed(1).replace('.', ',') + ' MB';
  return (n/(1024*1024*1024)).toFixed(2).replace('.', ',') + ' GB';
}

/* Diz se o arquivo pode entrar, e POR QUE não, quando não pode. Recusar sem
   explicar é o mesmo que falhar em silêncio. */
function arquivoAceito(arquivo){
  if(!arquivo) return {ok:false, motivo:'Nenhum arquivo escolhido.'};
  const tipo = ARQ_TIPOS[arquivo.type];
  if(!tipo){
    return {ok:false, motivo:
      `"${arquivo.name}" é do tipo ${arquivo.type || 'desconhecido'}, que não dá para mostrar na prévia. ` +
      `Use JPG, PNG, WEBP, GIF, MP4, MOV ou WEBM.`};
  }
  if(arquivo.size > ARQ_LIMITE){
    return {ok:false, motivo:
      `"${arquivo.name}" tem ${tamanhoLegivel(arquivo.size)} e o limite é ${tamanhoLegivel(ARQ_LIMITE)}. ` +
      `Exporte num tamanho menor e tente de novo.`};
  }
  return {ok:true, tipo};
}

/* O caminho dentro da área de arquivos. Começa pelo cliente para nunca
   misturar o material de dois clientes na mesma pasta, e leva um sufixo
   aleatório para duas artes com o mesmo nome não se sobrescreverem. */
function caminhoDoArquivo(clienteId, conteudoId, nome){
  const limpo = String(nome || 'arquivo')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-zA-Z0-9._-]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(-60) || 'arquivo';
  const marca = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  return `${clienteId}/${conteudoId}/${marca}-${limpo}`;
}

/* Quanto espaço já foi usado, e se está na hora de avisar. */
function espacoUsado(arquivos){
  const usado = (arquivos || []).reduce((s, a) => s + (Number(a.tamanho) || 0), 0);
  const fracao = usado / ARQ_ESPACO_TOTAL;
  return {
    usado, fracao,
    texto: `${tamanhoLegivel(usado)} de ${tamanhoLegivel(ARQ_ESPACO_TOTAL)}`,
    pct: Math.min(100, Math.round(fracao * 100)),
    apertado: fracao >= ARQ_AVISAR_EM,
  };
}

/* Troca duas peças de lugar na ordem do carrossel. Devolve a lista NOVA com
   o campo "ordem" já renumerado de 0 em diante — renumerar tudo evita que
   trocas repetidas deixem buracos e empates na numeração. */
function trocarOrdem(lista, id, direcao){
  const ord = (lista || []).slice().sort((a,b) => (a.ordem||0) - (b.ordem||0));
  const i = ord.findIndex(a => a.id === id);
  const j = i + direcao;
  if(i === -1 || j < 0 || j >= ord.length) return null;   // já está na ponta
  [ord[i], ord[j]] = [ord[j], ord[i]];
  return ord.map((a, n) => ({...a, ordem: n}));
}

/* Puras e fora do componente, para poderem ser testadas sem navegador. */

// 'AAAA-MM' do mês de uma data, ou null. É a chave de agrupamento do mês.
function mesDe(data){
  const s = String(data || '').slice(0, 7);
  return /^\d{4}-\d{2}$/.test(s) ? s : null;
}
function mesDeHoje(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
// Anda N meses para frente ou para trás sem cair na armadilha do dia 31.
function mesVizinho(mes, passo){
  const [a, m] = mes.split('-').map(Number);
  const d = new Date(a, m - 1 + passo, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function nomeDoMes(mes){
  const [a, m] = mes.split('-').map(Number);
  const nome = new Date(a, m-1, 1).toLocaleDateString('pt-BR', {month:'long'});
  return `${nome.charAt(0).toUpperCase()}${nome.slice(1)} de ${a}`;
}

function passaAprov(c, f, cfg){
  if(f.rede     && String(c.rede_id)     !== f.rede)     return false;
  if(f.editoria && String(c.editoria_id) !== f.editoria) return false;
  if(f.produto  && String(c.produto_id)  !== f.produto)  return false;
  if(f.formato  && (c.formato || '')     !== f.formato)  return false;
  if(f.status   && (c.status || 'rascunho') !== f.status) return false;
  if(f.busca){
    const q = semAcento(f.busca);
    const alvo = semAcento([c.titulo, c.legenda, c.hashtags, c.campanha, c.observacoes]
      .filter(Boolean).join(' '));
    if(!alvo.includes(q)) return false;
  }
  return true;
}

/* O resumo do mês. Conta por grupo de estado, não por estado solto: o que
   importa para quem olha é "quantos ainda dependem do cliente", e isso são
   três estados diferentes. */
function resumoAprovacao(lista){
  const vivos = (lista || []).filter(c => !c.arquivado);
  const tem = (...sts) => vivos.filter(c => sts.includes(c.status || 'rascunho')).length;
  const total = vivos.length;
  const aprovados = tem('aprovado');
  return {
    total,
    aprovados,
    aguardando: vivos.filter(c => APROV_AGUARDANDO.includes(c.status || '')).length,
    ajuste:     vivos.filter(c => APROV_EM_AJUSTE.includes(c.status || '')).length,
    interno:    tem('rascunho', 'em_revisao'),
    // Porcentagem só faz sentido com denominador. Sem peça no mês, é null —
    // e null vira "—" na tela, não "0%", que daria a impressão de atraso.
    pct: total ? Math.round((aprovados / total) * 100) : null,
  };
}

/* O painel de arquivos de uma peça: as artes na ordem em que vão aparecer,
   subir, reordenar e remover.

   A ordem é o carrossel. Por isso as setas mostram sempre o número do card
   ("1", "2", "3") — quem monta carrossel pensa em "esse é o segundo", não
   em "esse está na posição de índice 1". */
function ArquivosDoConteudo({arquivos, ocupado, aviso, aoSubir, aoMover, aoRemover, espaco}){
  const [confirmando, setConfirmando] = useState(null);
  const lista = (arquivos || []).slice().sort((a,b) => (a.ordem||0) - (b.ordem||0));

  return (
    <div className="arquivos">
      {arquivos === undefined ? (
        <div style={{color:'var(--muted)',fontSize:12.5}}>Carregando os arquivos…</div>
      ) : (
        <>
          {lista.length === 0 ? (
            <div style={{color:'var(--muted)',fontSize:12.5}}>
              Nenhum arquivo ainda. Suba a arte, os cards do carrossel ou o vídeo.
            </div>
          ) : (
            <div className="tiras">
              {lista.map((a, i) => (
                <div key={a.id} className="tira">
                  <div className="mini">
                    {a.tipo === 'video'
                      ? (a.link
                          ? <video src={a.link} muted playsInline preload="metadata" />
                          : <span className="semlink">vídeo</span>)
                      : (a.link
                          ? <img src={a.link} alt={a.nome || 'arte'} loading="lazy" />
                          : <span className="semlink">imagem</span>)}
                    <span className="numero">{i + 1}</span>
                  </div>
                  <div className="dados">
                    <div className="nome" title={a.nome || ''}>{a.nome || 'sem nome'}</div>
                    <div className="peso">{tamanhoLegivel(a.tamanho)}</div>
                  </div>
                  <div className="mexer">
                    <button className="btn" disabled={i === 0 || ocupado}
                      title="Mover para antes" onClick={()=>aoMover(a.id, -1)}>↑</button>
                    <button className="btn" disabled={i === lista.length - 1 || ocupado}
                      title="Mover para depois" onClick={()=>aoMover(a.id, 1)}>↓</button>
                    {confirmando === a.id ? (
                      <>
                        <button className="btn perigo" disabled={ocupado}
                          onClick={()=>{ setConfirmando(null); aoRemover(a); }}>Apagar</button>
                        <button className="btn" onClick={()=>setConfirmando(null)}>Não</button>
                      </>
                    ) : (
                      <button className="btn" disabled={ocupado} title="Remover este arquivo"
                        onClick={()=>setConfirmando(a.id)}>×</button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}

          <div className="subir">
            <label className={"btn brand" + (ocupado ? ' desligado' : '')}>
              {ocupado ? 'Subindo…' : '+ Adicionar arquivo'}
              <input type="file" multiple disabled={ocupado}
                accept={Object.keys(ARQ_TIPOS).join(',')}
                style={{display:'none'}}
                onChange={e=>{ aoSubir([...e.target.files]); e.target.value = ''; }} />
            </label>
            <span className="dica">
              JPG, PNG, WEBP, GIF, MP4, MOV ou WEBM · até {tamanhoLegivel(ARQ_LIMITE)} por arquivo
            </span>
          </div>

          {/* O aviso de espaço só aparece quando há motivo. Uma barra de
              "2% usado" permanente na tela é ruído. */}
          {espaco && espaco.apertado && (
            <div className="aviso" style={{marginTop:8}}>
              O espaço de arquivos está em <b>{espaco.pct}%</b> ({espaco.texto}).
              Vídeo antigo é o que mais pesa — vale apagar o que já foi publicado.
            </div>
          )}
          {aviso && <div className="avisoerro" style={{marginTop:8}}>{aviso}</div>}
        </>
      )}
    </div>
  );
}
