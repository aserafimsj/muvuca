<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MUVUCA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --brand:#F5B301; --brand-ink:#3a2c00;
    --bg:#F6F6F3; --panel:#FFFFFF; --line:#E8E7E2;
    --ink:#2C2C2A; --muted:#77766F;
    --pos:#7AC943; --neg:#E63329; --neu:#F5A623; --duv:#3FA9F5; --bot:#B8B8B8; --pol:#111111;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5}
  button{font-family:inherit;cursor:pointer}
  select,input,textarea{font-family:inherit;font-size:13px;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;width:100%}
  select:focus,input:focus,textarea:focus{border-color:var(--brand)}
  .app{display:flex;min-height:100vh}
  .side{width:210px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
    padding:16px 12px;display:flex;flex-direction:column;gap:3px}
  .logo{display:flex;align-items:center;gap:9px;padding:0 6px 14px}
  .logo .tile{width:28px;height:28px;border-radius:8px;background:var(--brand);color:var(--brand-ink);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
  .logo b{font-size:16px;font-weight:600}
  .switcher{display:flex;flex-direction:column;gap:3px;padding:9px 11px;margin-bottom:10px;
    border:1px solid var(--line);border-radius:var(--radius);background:var(--bg)}
  .switcher label{font-size:11px;color:var(--muted)}
  .switcher select{border:none;background:transparent;padding:0;font-size:13px;font-weight:600}
  .nav{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--radius);
    color:var(--muted);border:none;background:transparent;width:100%;text-align:left;font-size:14px}
  .nav:hover{background:var(--bg)}
  .nav.on{background:#FDF3D6;color:var(--brand-ink);font-weight:600}
  .nav svg{width:19px;height:19px;flex-shrink:0}
  .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px 6px 0;border-top:1px solid var(--line)}
  .foot .who{display:flex;align-items:center;gap:9px;min-width:0}
  .foot .av{width:30px;height:30px;flex-shrink:0;border-radius:50%;background:#E6F1FB;color:#185FA5;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
  .foot .id{min-width:0}
  .foot .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .foot .em{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .linkbtn{background:none;border:none;color:var(--muted);font-size:12px;text-align:left;text-decoration:underline;padding:0}
  .main{flex:1;min-width:0;padding:22px 26px}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
  .head h1{margin:0;font-size:20px;font-weight:600}
  .head p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel);font-size:13px;width:auto}
  .btn:hover{border-color:#cfcec8}
  .btn.brand{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
  .btn.full{width:100%;padding:11px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card .lbl{font-size:12px;color:var(--muted)}
  .card .val{font-size:26px;font-weight:600;margin-top:2px}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .filters input,.filters select{width:auto;min-width:150px}
  /* A busca é o filtro mais usado: merece caber inteira, e crescer com a tela. */
  .filters input[type=text],.filters input:not([type]){flex:1 1 240px;min-width:220px;max-width:420px}
  .row{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
  .row:last-child{border-bottom:1px solid var(--line)}
  .row .av{width:34px;height:34px;flex-shrink:0;border-radius:50%;background:var(--bg);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted)}
  .row .body{flex:1;min-width:0}
  .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
  .meta .who{font-size:13px;font-weight:600}
  .meta .net,.meta .prod{font-size:12px;color:var(--muted)}
  .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .txt{font-size:13px;color:#4a4a46}
  .ctrl{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex-shrink:0}
  .ctrl select{width:auto;min-width:120px}
  .sentbox{display:flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .reply{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .reply textarea{min-height:64px;resize:vertical}
  /* --- cartão do comentário (etapa 1: estrutura do Zmetrics, cores do MUVUCA) --- */
  .txtedit{font-size:13px;color:#4a4a46;line-height:1.5;resize:vertical;min-height:40px;
    padding:7px 9px;background:#FCFCFA;margin-top:2px}
  .iatags{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .pill{font-size:11px;font-weight:600;border:1px solid;border-radius:999px;padding:2px 9px}
  .iatags .motivo{font-size:12px;color:var(--muted)}
  .campos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .campo{flex:1 1 130px;min-width:0}
  .campo>span,.lblcampo{display:block;font-size:10.5px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
  .campo input,.campo select{width:100%;padding:6px 8px;font-size:13px}
  .reply .acoes{display:flex;gap:8px;flex-wrap:wrap}
  .avisoerro{font-size:12.5px;color:var(--neg);background:#FDEDEC;border-radius:6px;padding:7px 9px}
  /* --- fluxo de trabalho (etapa 2) --- */
  .abas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
  .aba{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 13px;
    font-size:13px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .aba:hover{border-color:var(--brand)}
  .aba.on{background:#FDF3D6;border-color:var(--brand);color:var(--brand-ink);font-weight:600}
  .aba .n{font-size:11px;font-weight:700;background:var(--bg);border-radius:999px;padding:1px 6px}
  .aba.on .n{background:#fff}
  /* margin-left:auto em vez de um espaçador: quando a linha do cabeçalho
     quebra no celular, o espaçador deixava o × solto no meio do cartão. */
  .btnx{background:transparent;border:none;color:#C2C8D0;font-size:19px;line-height:1;
    padding:0 4px;cursor:pointer;flex-shrink:0;margin-left:auto}
  .btnx:hover{color:var(--neg)}
  .fluxo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;
    border-top:1px solid var(--line);padding-top:11px}
  .btn.ok{background:#1E9E6A;border-color:#1E9E6A;color:#fff;font-weight:700}
  .btn.perigo{background:var(--neg);border-color:var(--neg);color:#fff;font-weight:600}
  .confirma{font-size:12.5px;color:var(--neg);font-weight:600}
  /* --- filtros (etapa 3) --- */
  .filtros{margin-bottom:14px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 11px;
    font-size:12.5px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--brand)}
  .chip.on{background:#FDF3D6;border-color:var(--brand);color:var(--brand-ink);font-weight:600}
  .chip .n{font-size:11px;font-weight:700;background:var(--bg);border-radius:999px;padding:1px 6px}
  .chip.on .n{background:#fff}
  .chip.juri.on{background:#FBF1DC;border-color:#B5852A;color:#7a5a12}
  .dedata{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
  .dedata input{width:auto}
  /* --- dashboard (etapa 4) --- */
  .periodo{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
  .resumoper{margin-left:auto;text-align:right}
  .resumoper .quando{font-size:12px;color:var(--muted)}
  .resumoper .quantos{font-size:13px;font-weight:600}
  /* Duas colunas fixas no desktop: são quatro blocos, e uma grade "automática"
     dava três colunas e deixava o quarto órfão numa linha sozinha. */
  .blocos{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
  @media(min-width:780px){ .blocos{grid-template-columns:1fr 1fr} }
  .bloco{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .btit{font-weight:600;font-size:14px;margin-bottom:2px}
  .bcab{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .segs{display:flex;gap:3px;flex-wrap:wrap}
  .seg{background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 9px;
    font-size:11.5px;color:var(--muted);cursor:pointer}
  .seg:hover:not(:disabled){border-color:var(--brand)}
  .seg.on{background:#FDF3D6;border-color:var(--brand);color:var(--brand-ink);font-weight:600}
  .seg:disabled{opacity:.4;cursor:default}
  .svgraf{width:100%;height:auto;display:block}
  .svgraf .gradelinha{stroke:var(--line);stroke-width:1}
  .svgraf .eixotxt{font-size:9.5px;fill:var(--muted)}
  .svgraf .valtxt{font-size:10.5px;font-weight:700;fill:var(--ink)}
  .svgraf .fatiatxt{font-size:11px;font-weight:700;fill:#fff}
  .legenda{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--muted)}
  .litem{display:inline-flex;align-items:center;gap:5px}
  .litem b{color:var(--ink)}
  .ldot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
  .legenda .lpct{font-size:11px}
  /* --- evolução diária --- */
  .filtrosativos{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:12px}
  .filtrosativos b{color:var(--ink);letter-spacing:.5px;font-size:11px}
  .filtrosativos .alerta{color:#8A6516;font-weight:600}
  .colunadia{cursor:pointer}
  .colunadia:hover rect:first-child{fill:rgba(245,179,1,.09)}
  .detlinha{display:grid;grid-template-columns:minmax(90px,14%) 1fr minmax(120px,auto);
    gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
  .detautor{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dettexto{color:#4a4a46;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .detsent{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);justify-content:flex-end}
  @media(max-width:560px){
    .detlinha{grid-template-columns:1fr;gap:3px}
    .detsent{justify-content:flex-start}
    .dettexto{white-space:normal}
  }
  .bnota{font-size:11.5px;color:var(--muted);margin-bottom:10px}
  .bvazio{font-size:12.5px;color:var(--muted);padding:14px 0}
  .barras{display:flex;flex-direction:column;gap:7px;margin-top:8px}
  .barra{display:grid;grid-template-columns:minmax(64px,26%) 1fr auto;align-items:center;gap:10px}
  .barra .rot{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* trilho recessivo; o dado é a barra, não o fundo */
  .barra .trilho{background:var(--bg);border-radius:4px;height:14px;overflow:hidden}
  .barra .preenche{height:100%;border-radius:0 4px 4px 0;min-width:3px}
  .barra .num{font-size:12.5px;font-weight:700;white-space:nowrap}
  .barra .num .pct{font-weight:400;color:var(--muted);margin-left:6px;font-size:11.5px}
  .tabnum{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
  .tabnum th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted);border-bottom:1px solid var(--line);padding:5px 4px}
  .tabnum td{padding:5px 4px;border-bottom:1px solid var(--line)}
  .tabnum td:nth-child(2),.tabnum th:nth-child(2),.tabnum td:last-child,.tabnum th:last-child{text-align:right}
  .svgtempo{width:100%;height:auto;display:block}
  .svgtempo .gradelinha{stroke:var(--line);stroke-width:1}
  .svgtempo .eixotxt{font-size:10px;fill:var(--muted)}
  .svgtempo .serie{fill:none;stroke:#8A6516;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .svgtempo .cruz{stroke:var(--line);stroke-width:1}
  .svgtempo .ponto{fill:#8A6516;stroke:#fff;stroke-width:2}
  .dicatempo{font-size:12.5px;color:var(--muted);margin-top:4px;min-height:18px}
  /* --- conteudos (etapa 6) --- */
  /* align-items:start para cada cartão ter a SUA altura. Sem isso, o cartão
     de um link que não pode ser incorporado estica até a altura do vizinho e
     fica com um vazio enorme embaixo. */
  .mural{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
    gap:16px;margin-top:4px;align-items:start}
  .post{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;
    display:flex;flex-direction:column;gap:9px}
  .pcab{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .prede{font-size:11px;font-weight:700;color:#185FA5}
  .pdata{font-size:11.5px;color:var(--muted);margin-left:auto}
  .pembed{width:100%;height:500px;border:none;border-radius:8px;background:#fff}
  .psemembed{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:8px;
    padding:22px 14px;text-align:center}
  .pnums{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
  .pnums span{display:inline-flex;flex-direction:column;line-height:1.25}
  .pnums b{font-size:13px;color:var(--ink)}
  .ppe{display:flex;justify-content:space-between;align-items:center;gap:8px;
    font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
  .ppe .temcom{color:#185FA5;font-weight:600}
  .ppe a{color:#185FA5;font-weight:600;text-decoration:none}
  @media(max-width:760px){
    .row{flex-wrap:wrap}
    .ctrl{flex-direction:row;align-items:center;width:100%;flex-wrap:wrap}
    .campo{flex:1 1 100%}
  }
  /* --- celular (etapa 7) ---
     Medido com o auditor: a tela do Community ficava com 622px de largura num
     aparelho de 375px e rolava para o lado. A causa era a fileira de botões do
     cabeçalho, que não quebrava linha. */
  @media(max-width:560px){
    .head{flex-wrap:wrap}
    .head>div:last-child{width:100%;flex-wrap:wrap}
    .head>div:last-child .btn{flex:1 1 auto}
    /* Tamanho de dedo. O auditor achou botão de 19px e campo de 29px; abaixo
       de ~38px erra o toque com frequência. */
    .btn,.filters input,.filters select,.campo input,.campo select,
    .aba,.chip,.periodo select,.periodo input,.mesbar .btn{min-height:38px}
    /* Link de texto no meio de um aviso ("ver esses", "limpar") ficava com a
       altura da letra — 14px. O auditor mediu; no dedo, não se acerta. */
    .aviso .linkbtn,.empty .linkbtn,.soon .linkbtn{
      display:inline-flex;align-items:center;min-height:38px}
    .btnx{min-width:38px;min-height:38px;font-size:22px}
    .seg{min-height:34px;padding:6px 12px}
    .ppe a,.meta a{display:inline-flex;align-items:center;min-height:34px}
    /* A lista de comentários ocupa a largura toda: no celular não há espaço
       para a coluna lateral de sentimento ficar à direita. */
    .row{padding-left:9px}
    .pembed{height:420px}
  }
  /* --- Aprovação de Conteúdo --- */
  .mesbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .mesbar .mesnome{font-size:16px;font-weight:600;min-width:190px;text-align:center}
  .mesbar .btn{padding:7px 13px}
  .progresso{margin-bottom:14px}
  .progresso .trilho{background:var(--line);border-radius:999px;height:10px;overflow:hidden}
  .progresso .cheio{height:100%;background:#1E9E6A;border-radius:999px;transition:width .3s}
  .progresso .pctxt{font-size:12.5px;color:var(--muted);margin-top:5px}
  .historico{margin-top:10px;border-top:1px solid var(--line);padding-top:9px;
    display:flex;flex-direction:column;gap:5px}
  .historico .hev{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:12.5px}
  .historico .quando{color:var(--muted);font-variant-numeric:tabular-nums;min-width:132px}
  .historico .quem{color:var(--muted)}
  /* --- arquivos da peça (etapa 2) --- */
  .arquivos{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  .tiras{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  .tira{display:flex;align-items:center;gap:10px}
  .tira .mini{position:relative;width:62px;height:62px;flex-shrink:0;border-radius:8px;
    overflow:hidden;background:var(--bg);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center}
  .tira .mini img,.tira .mini video{width:100%;height:100%;object-fit:cover;display:block}
  .tira .mini .semlink{font-size:10.5px;color:var(--muted)}
  /* O número é a posição no carrossel. Quem monta carrossel pensa em
     "esse é o segundo card", não em "índice 1". */
  .tira .mini .numero{position:absolute;left:4px;top:4px;min-width:17px;height:17px;
    border-radius:5px;background:rgba(0,0,0,.66);color:#fff;font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;padding:0 4px}
  .tira .dados{flex:1;min-width:0}
  .tira .nome{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tira .peso{font-size:11.5px;color:var(--muted)}
  .tira .mexer{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap}
  .tira .mexer .btn{padding:5px 9px;font-size:12.5px}
  .subir{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .subir .btn{cursor:pointer}
  .subir .btn.desligado{opacity:.6;cursor:default}
  .subir .dica{font-size:11.5px;color:var(--muted)}
  .btn .n{font-size:11px;font-weight:700;background:var(--bg);border-radius:999px;padding:1px 6px;margin-left:5px}
  /* --- tela Manhã ---
     O bloco vermelho toma o lugar da resposta, não fica ao lado dela: quando
     o caso é para escalar, NÃO existe texto sugerido para mostrar. Um aviso
     discreto ao lado de um rascunho pronto seria lido como "pode mandar
     assim mesmo". */
  .escalar{background:#FDEDEC;border:1px solid #F3C7C3;border-left:4px solid var(--neg);
    border-radius:8px;padding:12px 14px;margin-top:10px}
  .escalar .titulo{font-size:12px;font-weight:700;color:var(--neg);letter-spacing:.04em}
  .escalar .motivo{font-size:14px;font-weight:600;margin-top:3px}
  .escalar .oque{font-size:12.5px;color:var(--muted);margin-top:6px}
  .addwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px}
  .addgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field span{font-size:12px;color:var(--muted)}

}

// Endereço da própria página, sem hash nem parâmetros — é para cá que o

function urlBase(){

}
function traduzErro(m){
  m = (m||'').toLowerCase();
  if(m.includes('invalid login')) return 'Email ou senha incorretos.';
  if(m.includes('already registered') || m.includes('already been registered')) return 'Esse email já tem conta. Tente entrar.';
  if(m.includes('password should be')) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(m.includes('email not confirmed')) return 'Confirme seu email antes de entrar (ou peça pra desligar a confirmação).';
  if(m.includes('rate limit')) return 'Muitas tentativas. Espere um minutinho e tente de novo.';
  return m ? ('Erro: '+m) : 'Algo deu errado. Tente de novo.';
}

function Auth(){
  const [modo, setModo] = useState('login');
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [erro, setErro] = useState('');
  const [msg, setMsg] = useState('');
  const [busy, setBusy] = useState(false);
  async function enviar(){
    setErro(''); setMsg('');
    if(!email.trim()){ setErro('Preencha seu email.'); return; }
    if(modo!=='recuperar'){
      if(!senha){ setErro('Preencha email e senha.'); return; }
      if(senha.length < 6){ setErro('A senha precisa ter pelo menos 6 caracteres.'); return; }
    }
    setBusy(true);
    try{
      if(modo==='login'){
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: senha });
        if(error) setErro(traduzErro(error.message));
      } else if(modo==='recuperar'){
        const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: urlBase() });
        if(error) setErro(traduzErro(error.message));
        // Mensagem propositalmente neutra: não confirma se o email tem conta ou não.
        else setMsg('Se existir uma conta com esse email, enviamos um link para você criar uma senha nova. Confira a caixa de entrada — e o spam também.');
      } else {
        const { data, error } = await sb.auth.signUp({ email: email.trim(), password: senha });
        if(error) setErro(traduzErro(error.message));
        else if(!data.session) setMsg('Conta criada! Se aparecer pedido de confirmação por email, verifique sua caixa de entrada e depois entre.');
      }
    }catch(e){ setErro(traduzErro(e.message)); }
    setBusy(false);
  }
  const trocar = m => { setModo(m); setErro(''); setMsg(''); };
  const titulo = {login:'Entrar no MUVUCA', signup:'Criar sua conta', recuperar:'Esqueci minha senha'}[modo];
  const sub = {
    login:'Use seu email e senha.',
    signup:'É rápido — email e uma senha de pelo menos 6 caracteres.',
    recuperar:'Digite seu email e enviamos um link para você criar uma senha nova.'
  }[modo];
  const rotulo = {login:'Entrar', signup:'Criar conta', recuperar:'Enviar link de recuperação'}[modo];
  return (
    <div className="auth">
      <div className="tile">M</div>
      <h1>{titulo}</h1>
      <p className="sub">{sub}</p>
      {erro && <div className="err">{erro}</div>}
      {msg && <div className="ok">{msg}</div>}
      <div className="grp">
        <label>Email</label>
        <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="voce@email.com" onKeyDown={e=>e.key==='Enter'&&enviar()} />
      </div>
      {modo!=='recuperar' && (
        <div className="grp">
          <label>Senha</label>
          <input type="password" value={senha} onChange={e=>setSenha(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==='Enter'&&enviar()} />
          {modo==='login' && <button className="linkbtn" style={{marginTop:8}} onClick={()=>trocar('recuperar')}>Esqueci minha senha</button>}
        </div>
      )}
      <button className="btn brand full" disabled={busy} onClick={enviar}>
        {busy ? 'Aguarde…' : rotulo}
      </button>
      <div className="toggle">
        {modo==='login'     && <span>Não tem conta? <button onClick={()=>trocar('signup')}>Cadastre-se</button></span>}
        {modo==='signup'    && <span>Já tem conta? <button onClick={()=>trocar('login')}>Entrar</button></span>}
        {modo==='recuperar' && <span>Lembrou a senha? <button onClick={()=>trocar('login')}>Voltar para o login</button></span>}
      </div>
    </div>
  );
}

// Tela mostrada quando a pessoa volta pelo link de recuperação recebido por email.
function NovaSenha({onPronto}){
  const [senha, setSenha] = useState('');
  const [senha2, setSenha2] = useState('');
  const [erro, setErro] = useState('');
  const [busy, setBusy] = useState(false);
  async function salvar(){
    setErro('');
    if(senha.length < 6){ setErro('A senha precisa ter pelo menos 6 caracteres.'); return; }
    if(senha !== senha2){ setErro('As duas senhas não são iguais.'); return; }
    setBusy(true);
    try{
      const { error } = await sb.auth.updateUser({ password: senha });
      if(error){ setErro(traduzErro(error.message)); setBusy(false); return; }
      // Limpa o token de recuperação da barra de endereço.
      window.history.replaceState(null, '', urlBase());
      onPronto();
    }catch(e){ setErro(traduzErro(e.message)); }
    setBusy(false);
  }
  const enter = e => e.key==='Enter' && salvar();
  return (
    <div className="auth">
      <div className="tile">M</div>
      <h1>Criar nova senha</h1>
      <p className="sub">Escolha uma senha de pelo menos 6 caracteres.</p>
      {erro && <div className="err">{erro}</div>}
      <div className="grp">
        <label>Nova senha</label>
        <input type="password" value={senha} onChange={e=>setSenha(e.target.value)} placeholder="••••••••" onKeyDown={enter} autoFocus />
      </div>
      <div className="grp">
        <label>Repita a nova senha</label>
        <input type="password" value={senha2} onChange={e=>setSenha2(e.target.value)} placeholder="••••••••" onKeyDown={enter} />
      </div>
      <button className="btn brand full" disabled={busy} onClick={salvar}>{busy ? 'Salvando…' : 'Salvar nova senha'}</button>
    </div>
  );
}

function Onboarding({user, onDone}){
  const [f, setF] = useState({nome:'', cargo:'', equipe:'', telefone:''});
  const [busy, setBusy] = useState(false);
  const [erro, setErro] = useState('');
  const set = (k,v)=>setF(p=>({...p,[k]:v}));
  async function concluir(){
    setErro('');
    if(!f.nome.trim()){ setErro('Como podemos te chamar?'); return; }
    setBusy(true);
    const { error } = await sb.from('perfis').upsert({
      id: user.id,
      nome: f.nome.trim(),
      cargo: f.cargo.trim() || null,
      equipe: f.equipe.trim() || null,
      telefone: f.telefone.trim() || null,
      onboarded: true
    });
    setBusy(false);
    if(error){ setErro('Não consegui salvar: '+error.message); return; }
    onDone();
  }
  const enter = e => e.key==='Enter' && concluir();
  return (
    <div className="auth">
      <div className="tile">M</div>
      <h1>Bem-vindo ao MUVUCA 👋</h1>
      <p className="sub">Complete seu cadastro para deixarmos tudo do seu jeito.</p>
      {erro && <div className="err">{erro}</div>}
      <div className="grp">
        <label>Nome</label>
        <input value={f.nome} onChange={e=>set('nome',e.target.value)} placeholder="Como podemos te chamar?" onKeyDown={enter} autoFocus />
      </div>
      <div className="grp">
        <label>Email</label>
        <input className="ro" value={user.email} readOnly />
      </div>
      <div className="grp">
        <label>Cargo / função <span className="opt">(opcional)</span></label>
        <input value={f.cargo} onChange={e=>set('cargo',e.target.value)} placeholder="Ex.: Social Media, Community Manager" onKeyDown={enter} />
      </div>
      <div className="grp">
        <label>Equipe / squad <span className="opt">(opcional)</span></label>
        <input value={f.equipe} onChange={e=>set('equipe',e.target.value)} placeholder="Ex.: Squad Odin" onKeyDown={enter} />
      </div>
      <div className="grp">
        <label>Telefone <span className="opt">(opcional)</span></label>
        <input value={f.telefone} onChange={e=>set('telefone',e.target.value)} placeholder="(11) 99999-9999" onKeyDown={enter} />
      </div>
      <button className="btn brand full" disabled={busy} onClick={concluir}>{busy ? 'Salvando…' : 'Entrar no MUVUCA'}</button>
    </div>
  );
}

/* Os quatro estados de trabalho de um comentário.
   A coluna "triagem" do MUVUCA já era exatamente isto, com três dos quatro
   estados do Zmetrics escritos com outros nomes:
     Pendente   = a fila         (Zmetrics: pendente)
     Respondido = já respondido  (Zmetrics: respondido)
     Ignorar    = decidiu não responder (Zmetrics: nao_respondido)
   Só a Lixeira faltava. Os valores GRAVADOS continuam os mesmos de sempre —
   trocar 'Ignorar' por 'Não respondido' no banco obrigaria a reescrever
   comentário antigo, e reescrever dado do usuário é o que não se faz. O nome
   novo é só de tela. */
const SITUACOES = {
  'Pendente':   {rotulo:null,              cor:'var(--brand)'},
  'Respondido': {rotulo:'✓ Respondido',    cor:'#1E9E6A'},
  'Ignorar':    {rotulo:'Não respondido',  cor:'#8A8F98'},

};

const ABAS = [

   vazio:'Comentário novo chega aqui. Use Responder ou Não responder para tirá-lo da fila.'},

   vazio:'Comentários que você decidir não responder (bots, spam, provocação) vêm para cá.'},

   vazio:'O × manda o comentário para cá. Dá para restaurar ou excluir de vez.'},

// Na lixeira o comentário está fora de tudo: não conta nas estatísticas, não
// entra em filtro e, principalmente, não vai para a IA — pagar para
// classificar o que você jogou fora seria dinheiro no lixo, literalmente.
const naLixeira = i => i.triagem === 'Lixeira';

/* ---------- período do dashboard ----------
   Contas em horário local de propósito: "hoje" para quem usa o sistema é o dia
   do relógio dele. */
const PERIODOS = [
  ['total','Todo o período'], ['ontem','Ontem'], ['7d','Últimos 7 dias'],
  ['28d','Últimos 28 dias'], ['90d','Últimos 90 dias'], ['semana','Esta semana'],
  ['mes','Este mês'], ['ano','Este ano'], ['semana_passada','Semana passada'],
  ['mes_passado','Mês passado'], ['custom','Escolher as datas'],
];
const DIA_MS = 86400000;
const inicioDoDia = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0,0,0,0);
const fimDoDia    = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23,59,59,999);
function dataLocal(s){
  if(!s) return null;
  const [a,m,d] = String(s).slice(0,10).split('-').map(Number);
  return (a && m && d) ? new Date(a, m-1, d) : null;
}
function segundaDe(d){ const x = inicioDoDia(d); return new Date(x.getTime() - ((x.getDay()+6)%7)*DIA_MS); }

/* A data analítica de um comentário é UMA SÓ: quando ele foi publicado
   (`data_publicacao`). Nada de reserva.

   Antes eu caía na data em que a IA o analisou quando faltava a de
   publicação. É o mesmo erro de usar a data de importação: um comentário
   publicado em 10/09 e analisado em 12/09 apareceria como 12/09, e o
   relatório diria que houve movimento num dia em que não houve.

   Sem data de publicação, o comentário não tem data: entra em "Todo o
   período" e fica de fora de qualquer recorte. A tela avisa quantos são. */
function dataDoComentario(i){
  return dataLocal(i.data_publicacao);
}

function resolvePeriodo(chave, de, ate){
  const agora = new Date(), h0 = inicioDoDia(agora), h1 = fimDoDia(agora);
  switch(chave){
    case 'ontem': { const o = new Date(h0.getTime()-DIA_MS); return {de:inicioDoDia(o), ate:fimDoDia(o)}; }
    case '7d':    return {de: inicioDoDia(new Date(h0.getTime()-6*DIA_MS)),  ate:h1};
    case '28d':   return {de: inicioDoDia(new Date(h0.getTime()-27*DIA_MS)), ate:h1};
    case '90d':   return {de: inicioDoDia(new Date(h0.getTime()-89*DIA_MS)), ate:h1};
    case 'semana':return {de: segundaDe(agora), ate:h1};
    case 'mes':   return {de: new Date(agora.getFullYear(), agora.getMonth(), 1), ate:h1};
    case 'ano':   return {de: new Date(agora.getFullYear(), 0, 1), ate:h1};
    case 'semana_passada': { const s = segundaDe(agora);
      return {de: new Date(s.getTime()-7*DIA_MS), ate: fimDoDia(new Date(s.getTime()-DIA_MS))}; }
    case 'mes_passado': return {de: new Date(agora.getFullYear(), agora.getMonth()-1, 1),
      ate: fimDoDia(new Date(agora.getFullYear(), agora.getMonth(), 0))};
    case 'custom': { const a = dataLocal(de), b = dataLocal(ate);
      return {de: a?inicioDoDia(a):null, ate: b?fimDoDia(b):null}; }
    default: return {de:null, ate:null};
  }
}

function noPeriodo(i, chave, de, ate){
  if(chave === 'total') return true;
  const d = dataDoComentario(i);
  if(!d) return false;
  if(de && d < de) return false;
  if(ate && d > ate) return false;
  return true;
}

const fmtBR = d => d ? d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}) : '…';
const chaveDia = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

/* ---------- filtros da lista de comentários ----------
   Fora do componente de propósito: assim a regra de "este comentário passa?"
   é uma função pura, que dá para testar sem abrir tela nenhuma. */
const FILTRO_VAZIO = {
  sent:'', iaTriagem:'', juridico:false, rede:'', produto:'',
  editoria:'', origem:'', post:'', de:'', ate:'',
};

function passaNoFiltro(i, f, busca){
  if(f.sent      && String(i.sentimento_id||'') !== f.sent)     return false;
  if(f.iaTriagem && (i.ia_triagem||'')          !== f.iaTriagem) return false;
  if(f.juridico  && !i.ia_juridico)                             return false;
  if(f.rede      && String(i.rede_id||'')       !== f.rede)     return false;
  if(f.produto   && String(i.produto_id||'')    !== f.produto)  return false;
  if(f.editoria  && String(i.editoria_id||'')   !== f.editoria) return false;
  if(f.origem    && (i.origem||'')              !== f.origem)   return false;
  if(f.post      && (i.link_conteudo||'')       !== f.post)     return false;
  // Comentário sem data não entra em recorte de data. Deixá-lo passar faria
  // "de 1 a 5 de setembro" devolver coisa de data desconhecida junto.
  if(f.de   && !(i.data_publicacao && i.data_publicacao >= f.de))   return false;
  if(f.ate  && !(i.data_publicacao && i.data_publicacao <= f.ate))  return false;
  if(busca){
    const q = busca.toLowerCase();
    const achou = (i.texto||'').toLowerCase().includes(q)
               || (i.autor||'').toLowerCase().includes(q)
               || (i.resposta||'').toLowerCase().includes(q);
    if(!achou) return false;
  }
  return true;
}

/* Paleta para as dimensões sem cor própria (rede, produto, editoria).
   É a mesma do Zmetrics, e a ordem é a dele: testei duas reordenações
   "melhores" e as duas pioraram a separação para daltonismo. O pior par
   adjacente fica na faixa que só é aceitável com reforço além da cor — daí
   o número aparecer em toda fatia e barra. */
const PALETA = ['#2C57C9','#1E9E6A','#B5852A','#7C5CD6','#D64545','#0FA3A3','#E07A1F','#3AA0FF','#8A93A2','#12224C'];

/* Topo do eixo arredondado para cima até um número par. Com o máximo em 11, a
   linha do meio cai em 5,5 e o rótulo arredondado dizia "6" — rótulo que não
   corresponde à linha é uma mentirinha no eixo. Com 12, a metade é 6 de fato. */
const topoDoEixo = m => Math.max(2, Math.ceil(Math.max(1, m) / 2) * 2);
const corDaLista = (nomes) => {
  const mapa = {};
  nomes.forEach((n,k) => { mapa[n] = PALETA[k % PALETA.length]; });
  // Cor segue a entidade, nunca a posição do momento: se um filtro tirar uma
  // categoria, as que sobram não podem trocar de cor.
  return n => mapa[n] || '#8A93A2';
};

/* ---------- contas do dashboard ----------
   Puras e fora dos componentes, pelo mesmo motivo dos filtros: número errado
   em relatório é mentira silenciosa, e só teste pega. */

// Conta quantos comentários caem em cada valor, do maior para o menor.
// "semNome" agrupa o que está em branco num balde explícito, em vez de
// simplesmente sumir da conta — o total tem que fechar com a lista.
function contarPor(itens, valorDe, semNome){
  const baldes = {};
  itens.forEach(i => {
    const v = valorDe(i);
    const k = (v === null || v === undefined || v === '') ? (semNome || null) : String(v);
    if(k === null) return;
    baldes[k] = (baldes[k] || 0) + 1;
  });
  return Object.keys(baldes)
    .map(nome => ({nome, n: baldes[nome]}))
    .sort((a,b) => b.n - a.n || a.nome.localeCompare(b.nome,'pt-BR'));
}

/* Cruza duas dimensões: para cada categoria de A, quanto tem de cada B.
   É o que o gráfico empilhado desenha. */
function cruzarPor(itens, valorA, valorB, semNomeA){
  const cats = contarPor(itens, valorA, semNomeA).map(d => d.nome);
  const bs = contarPor(itens, valorB).map(d => d.nome);
  const linhas = cats.map(c => {
    const fatias = {};
    bs.forEach(b => {
      fatias[b] = itens.filter(i => {
        const va = valorA(i), vb = valorB(i);
        const ca = (va === null || va === undefined || va === '') ? semNomeA : String(va);
        return ca === c && String(vb) === b;
      }).length;
    });
    const soma = bs.reduce((a,b) => a + fatias[b], 0);
    return {nome: c, fatias, soma};
  });
  return {cats, series: bs, linhas};
}

/* Série dia a dia. Os dias sem nenhum comentário entram valendo zero: sem
   isso a linha do tempo "pula" o vazio e um fim de semana parado parece
   movimento contínuo. */
function serieDiaria(itens){
  const porDia = {};
  itens.forEach(i => { const d = dataDoComentario(i); if(d) porDia[chaveDia(inicioDoDia(d))] = (porDia[chaveDia(inicioDoDia(d))]||0) + 1; });
  const dias = Object.keys(porDia).sort();
  if(!dias.length) return [];
  const ini = dataLocal(dias[0]), fim = dataLocal(dias[dias.length-1]);
  const serie = [];
  for(let t = ini.getTime(); t <= fim.getTime(); t += DIA_MS){
    const k = chaveDia(new Date(t));
    serie.push({dia: k, n: porDia[k] || 0});
  }
  return serie;
}

/* A mesma linha do tempo, quebrada por alguma dimensão (o "Por sentimento").
   Reaproveita serieDiaria para os dias, de modo que todas as linhas tenham
   exatamente o mesmo eixo — séries com eixos diferentes não se comparam. */
function serieDiariaPor(itens, valorDe, semNome){
  const base = serieDiaria(itens);
  if(!base.length) return {dias: [], series: [], totais: []};
  const dias = base.map(p => p.dia);

  /* O mesmo balde de "sem valor" do contarPor, e pelo mesmo motivo. Sem ele,
     o comentário sem sentimento sumia da pilha em silêncio, e a soma das
     fatias não fechava com o total do dia — a barra ficaria menor do que o
     número escrito em cima dela. */
  const daCategoria = i => {
    const v = valorDe(i);
    return (v === null || v === undefined || v === '') ? semNome : String(v);
  };
  const nomes = contarPor(itens, valorDe, semNome).map(d => d.nome);

  const series = nomes.map(nome => ({
    nome,
    valores: dias.map(dia => itens.filter(i => {
      const d = dataDoComentario(i);
      return d && chaveDia(inicioDoDia(d)) === dia && daCategoria(i) === nome;
    }).length),
  }));
  return {dias, series, totais: base.map(p => p.n)};
}

// Os comentários de um dia, na ordem em que aparecem na lista.
function doDia(itens, dia){
  return itens.filter(i => {
    const d = dataDoComentario(i);
    return d && chaveDia(inicioDoDia(d)) === dia;
  });
}

/* ---------- exportação CSV ----------
   Função pura: recebe os comentários e devolve o texto do arquivo. Fora do
   componente para poder ser testada sem navegador. */

// Como o estado de trabalho sai no arquivo. Sem rótulo, "Pendente" viraria
// vazio, e "Ignorar" não diz nada para quem abre a planilha depois.
const SITUACAO_CSV = {
  'Pendente':'Na fila', 'Respondido':'Respondido',
  'Ignorar':'Não responder', 'Lixeira':'Na lixeira',
};

function paraCSV(itens, cfg){
  const nomeDe = (lista, id) => lista.find(x => x.id === id)?.nome || '';
  const colunas = [
    'situacao','data_publicacao','rede','origem','post','autor','texto',
    'sentimento','produto','editoria','resposta',
    'ia_recomendacao','ia_motivo','ia_juridico','ia_analisado_em',
  ];

  /* Toda célula sai entre aspas, e aspas de dentro viram aspas duplas. É o
     que protege o texto do comentário: ponto e vírgula, quebra de linha e
     aspas dentro dele deixam de partir o arquivo em colunas erradas. */
  const esc = v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g,'""') + '"';

  const linhas = itens.map(i => [
    SITUACAO_CSV[i.triagem || 'Pendente'] || i.triagem,
    i.data_publicacao || '',
    nomeDe(cfg.redes, i.rede_id),
    i.origem || '',
    i.link_conteudo || '',
    i.autor || '',
    i.texto || '',
    nomeDe(cfg.sentimentos, i.sentimento_id),
    nomeDe(cfg.produtos, i.produto_id),
    nomeDe(cfg.editorias, i.editoria_id),
    i.resposta || '',
    IA_TRIAGEM[i.ia_triagem]?.label || '',
    i.ia_motivo || '',
    // Vazio quando a IA nunca olhou: "não" daria a entender que ela avaliou
    // e concluiu que não era sensível, o que é diferente de não ter olhado.
    i.ia_em ? (i.ia_juridico ? 'sim' : 'não') : '',
    i.ia_em || '',
  ].map(esc).join(';'));

  /* Duas escolhas para o arquivo abrir certo ao ser clicado duas vezes:

     ";" em vez de "," — no Excel em português o separador de lista é ponto e
     vírgula, e um arquivo com vírgula abre com tudo amontoado numa coluna só.
     (O Zmetrics usa vírgula; aqui não, de propósito.)

     "﻿" na frente é a marca que diz ao Excel que o texto está em UTF-8.
     Sem ela, "Dúvida" vira "DÃºvida". */
  return '﻿' + [colunas.join(';'), ...linhas].join('\r\n');
}

function baixarCSV(texto, nome){
  const blob = new Blob([texto], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ---------- estado de cada análise ----------
   O pedido é explícito: "Aguardando dados" não pode ser resposta genérica.
   São três situações diferentes, e confundi-las esconde o que está faltando:

     sem_dados     — não há nada deste canal
     insuficiente  — há comentários, mas falta JUSTAMENTE o campo que este
                     gráfico usa (e a tela diz qual)
     nao_construido— o dado existe; a tela é que ainda não foi feita
     pronto        — dá para ver agora, em Relatórios

   Fora do componente para ser testada sem navegador. */
const PRECISA = {
  evol_diaria: {campo:'data_publicacao', falta:'data de publicação preenchida'},
  vol_mensal:  {campo:'data_publicacao', falta:'data de publicação preenchida'},
  vol_semana:  {campo:'data_publicacao', falta:'data de publicação preenchida'},
  sentimento:  {campo:'sentimento_id',   falta:'sentimento definido'},
  termos:      {campo:'texto',           falta:'texto'},
  hashtags:    {campo:'texto',           falta:'texto'},
  top_posts:   {fonte:'publicacoes',     falta:'publicações importadas'},
};
// O que já dá para ver hoje, no módulo Relatórios.
const JA_PRONTO = {evol_diaria:true, sentimento:true};

function estadoAnalitico(id, interacoes, publicacoes, rede){
  const regra = PRECISA[id] || {};
  const daRede = x => !rede || x.rede_id === rede.id;

  if(regra.fonte === 'publicacoes'){
    const pubs = (publicacoes || []).filter(daRede);
    if(!pubs.length) return {estado:'sem_dados', selo:'Sem dados', quantos:0, unidade:'publicações',
      explica:'Nenhuma publicação deste canal foi importada ainda. Elas entram pela planilha, em Importar dados.'};
    return {estado:'nao_construido', selo:'Ainda não construído', quantos:pubs.length, unidade:'publicações',
      explica:`${pubs.length} publicação(ões) deste canal já estão no sistema. Esta tela ainda não foi construída.`};
  }

  const vivos = (interacoes || []).filter(i => !naLixeira(i) && daRede(i));
  if(!vivos.length) return {estado:'sem_dados', selo:'Sem dados', quantos:0, unidade:'comentários',
    explica:'Nenhum comentário deste canal ainda. Traga comentários em Community › Colar em lote, ou importe a planilha.'};

  const com = vivos.filter(i => {
    const v = i[regra.campo];
    return v !== null && v !== undefined && String(v).trim() !== '';
  }).length;

  if(com === 0) return {estado:'insuficiente', selo:'Falta preencher', quantos:0, unidade:'comentários prontos',
    explica:`Há ${vivos.length} comentário(s) deste canal, mas nenhum tem ${regra.falta}. Esta análise depende desse campo — preencha no cartão do comentário.`};

  if(JA_PRONTO[id]) return {estado:'pronto', selo:'Pode ver agora', quantos:com, unidade:'comentários',
    explica:`${com} comentário(s) prontos. Clique para abrir em Relatórios.`};

  return {estado:'nao_construido', selo:'Ainda não construído', quantos:com, unidade:'comentários prontos',
    explica:`${com} de ${vivos.length} comentário(s) deste canal têm ${regra.falta}. O dado está aqui; esta tela ainda não foi construída.`};
}

/* ---------- conteúdos (publicações) ----------
   Puras e fora do componente, para poderem ser testadas sem navegador. */

/* Normaliza um link para comparar. O Zmetrics compara o texto cru do link;
   aqui não, porque na prática o mesmo post chega escrito de várias formas:
   com e sem "https://", com e sem "www.", com barra no fim, e com rabicho de
   campanha (?utm_source=...). Comparando cru, o comentário se desgruda do
   post em silêncio e a contagem simplesmente dá zero. */
function chaveDoPost(url){
  return String(url || '')
    .trim().toLowerCase()
    .replace(/^https?:\/\//, '')
    .replace(/^www\./, '')
    .split(/[?#]/)[0]
    .replace(/\/+$/, '');
}

const mesmoPost = (a, b) => {
  const ka = chaveDoPost(a), kb = chaveDoPost(b);
  return !!ka && ka === kb;
};

function redeDoLink(url){
  if(/instagram\.com/i.test(url)) return 'Instagram';
  if(/facebook\.com|fb\.watch|fb\.me/i.test(url)) return 'Facebook';
  if(/tiktok\.com/i.test(url)) return 'TikTok';
  if(/youtube\.com|youtu\.be/i.test(url)) return 'YouTube';
  return null;
}

// Endereço que o Instagram e o Facebook aceitam para mostrar o post dentro da
// página. Devolve null quando não dá — e aí o cartão mostra só o link.
function embedDoPost(url){
  const s = String(url || '');
  const ig = s.match(/instagram\.com\/(p|reel|reels|tv)\/([A-Za-z0-9_-]+)/i);
  if(ig){
    const tipo = ig[1].toLowerCase() === 'reels' ? 'reel' : ig[1].toLowerCase();
    return 'https://www.instagram.com/' + tipo + '/' + ig[2] + '/embed';
  }
  if(/facebook\.com/i.test(s)){
    return 'https://www.facebook.com/plugins/post.php?href=' + encodeURIComponent(s) + '&show_text=true&width=360';
  }
  return null;
}

/* Soma a versão orgânica com a paga.

   Parece bobo, mas resolve uma armadilha real da importação: o sufixo "_org"
   não quer dizer "orgânico", quer dizer "o título da coluna não dizia pago".
   Se a planilha traz uma coluna única de curtidas, ela cai inteira em
   curtidas_org e curtidas_pago fica vazio.

   A soma acerta nos dois casos: com uma coluna, soma = a própria coluna; com
   duas, soma = o total. O que seria errado é CHAMAR a _org de "orgânica". Por
   isso a tela mostra o total e não promete separação que pode não existir. */
function metrica(p, base){
  const a = p[base + '_org'], b = p[base + '_pago'];
  if((a === null || a === undefined) && (b === null || b === undefined)) return null;
  return Number(a || 0) + Number(b || 0);
}

// Encurta um link comprido para caber na lista, mantendo o começo e o fim —
// cortar só o fim deixaria vários posts do mesmo perfil com o mesmo rótulo.
function rotuloPost(p){
  const s = String(p||'').replace(/^https?:\/\/(www\.)?/,'');
  return s.length <= 42 ? s : s.slice(0,24) + '…' + s.slice(-14);
}

// Como a recomendação da IA aparece na tela. É informativa: diz o que a IA
// acha que fazer com o comentário. Não confundir com a coluna "triagem", que
// é o SEU estado de trabalho (Pendente / Respondido / Ignorar).
const IA_TRIAGEM = {
  responder:     {label:'IA: responder',    cor:'#185FA5'},
  curtir:        {label:'IA: só curtir',    cor:'#1E9E6A'},
  nao_responder: {label:'IA: não responder',cor:'#8A8F98'},
};

// Campo de texto que só grava quando você sai dele. Gravar a cada tecla
// digitada dispararia uma escrita no banco por letra.
function CampoTexto({rotulo, valor, onGravar, tipo='text', dica}){
  const [v, setV] = useState(valor || '');
  useEffect(()=>{ setV(valor || ''); },[valor]);
  return (
    <label className="campo">
      <span>{rotulo}</span>
      <input type={tipo} value={v} placeholder={dica||''}
        onChange={e=>setV(e.target.value)}
        onBlur={()=>{ const novo = v.trim(); if(novo !== String(valor||'')) onGravar(novo || null); }} />
    </label>
  );
}

function Linha({it, cfg, onCampo, onGerarResposta, onExcluir}){
  const [resp, setResp] = useState(it.resposta || "");
  const [texto, setTexto] = useState(it.texto || "");
  const [gerando, setGerando] = useState(false);
  const [copiado, setCopiado] = useState(false);
  const [aviso, setAviso] = useState('');
  useEffect(()=>{ setResp(it.resposta || ""); },[it.resposta]);
  useEffect(()=>{ setTexto(it.texto || ""); },[it.texto]);

  const [confirmando, setConfirmando] = useState(false);
  const sent = cfg.sentimentos.find(s=>s.id===it.sentimento_id);
  const iaRec = IA_TRIAGEM[it.ia_triagem];
  const naoSalvo = resp !== (it.resposta || '');
  const sit = it.triagem || 'Pendente';
  const sitInfo = SITUACOES[sit] || SITUACOES['Pendente'];
  const noLixo = sit === 'Lixeira';

  async function gerar(){
    setGerando(true); setAviso('');
    const r = await onGerarResposta(it);
    setGerando(false);
    if(r.erro) setAviso(r.erro);
  }

  async function copiar(){
    try {
      await navigator.clipboard.writeText(resp);
      setCopiado(true); setTimeout(()=>setCopiado(false), 1600);
    } catch(e){
      setAviso('O navegador bloqueou a cópia. Selecione o texto e use Ctrl+C.');
    }
  }

  return (
    <div className="row" style={{borderLeft:`3px solid ${sitInfo.cor}`, paddingLeft:11, opacity: noLixo ? .8 : 1}}>
      <div className="av">{iniciais(it.autor)}</div>
      <div className="body">
        <div className="meta">
          <span className="who">{it.autor || 'Sem autor'}</span>
          {it.origem && <span className="tag">{it.origem}</span>}
          {sitInfo.rotulo && <span style={{fontSize:11,fontWeight:700,color:sitInfo.cor}}>{sitInfo.rotulo}</span>}
          {it.link_conteudo && /^https?:\/\//i.test(it.link_conteudo) &&
            <a href={it.link_conteudo} target="_blank" rel="noopener noreferrer" style={{fontSize:12,color:'#185FA5'}}>ver conteúdo</a>}
          {!noLixo && <button className="btnx" title="Mover para a Lixeira" onClick={()=>onCampo(it.id,'triagem','Lixeira')}>×</button>}
        </div>

        {/* Editável: texto colado do Instagram costuma vir torto e antes não
            havia como corrigir sem apagar e recriar o comentário.
            Grava ao sair do campo — a cada tecla seria uma escrita no banco
            por letra digitada. */}
        <textarea className="txtedit" value={texto} rows={2}
          onChange={e=>setTexto(e.target.value)}
          onBlur={()=>{ if(texto !== (it.texto||'')) onCampo(it.id,'texto', texto); }}
          placeholder="texto do comentário" />

        {(iaRec || it.ia_juridico || it.ia_motivo) && (
          <div className="iatags">
            {iaRec && <span className="pill" style={{color:iaRec.cor, borderColor:iaRec.cor+'55', background:iaRec.cor+'14'}}>{iaRec.label}</span>}
            {it.ia_juridico && <span className="pill" style={{color:'#B5852A', borderColor:'#B5852A55', background:'#B5852A14'}}>Jurídico/STN</span>}

            onGravar={v=>onCampo(it.id,'data_publicacao', v)} />

        <div className="campos">
          <label className="campo"><span>Rede</span>
            <select value={it.rede_id || ''} onChange={e=>onCampo(it.id,'rede_id', e.target.value?Number(e.target.value):null)}>

              {cfg.redes.map(r=><option key={r.id} value={r.id}>{r.nome}</option>)}
            </select>
          </label>
          <label className="campo"><span>Origem</span>
            <select value={it.origem || 'Feed'} onChange={e=>onCampo(it.id,'origem', e.target.value)}>
              <option>Feed</option><option>DM</option>
            </select>
          </label>
          <label className="campo"><span>Produto</span>
            <select value={it.produto_id || ''} onChange={e=>onCampo(it.id,'produto_id', e.target.value?Number(e.target.value):null)}>
              <option value="">—</option>
              {cfg.produtos.map(p=><option key={p.id} value={p.id}>{p.nome}</option>)}
            </select>
          </label>
          <label className="campo"><span>Editoria</span>
            <select value={it.editoria_id || ''} onChange={e=>onCampo(it.id,'editoria_id', e.target.value?Number(e.target.value):null)}>
              <option value="">—</option>
              {cfg.editorias.map(ed=><option key={ed.id} value={ed.id}>{ed.nome}</option>)}
            </select>
          </label>
        </div>

        {/* Sempre visível, como no Zmetrics: o rascunho é o que se olha
            primeiro, e escondê-lo atrás de um clique só somava trabalho. */}
        <div className="reply">
          <div className="lblcampo">Resposta sugerida</div>
          <textarea value={resp} onChange={e=>setResp(e.target.value)}
            placeholder={gerando ? 'gerando sugestão…' : 'Escreva a resposta sugerida, ou peça uma à IA.'} />
          <div className="acoes">
            {/* Salvar o rascunho NÃO marca mais o comentário como respondido.
                Antes marcava, porque não havia outro jeito de sair da fila.
                Agora existe o botão Responder, embaixo, e juntar as duas
                coisas fazia o comentário sumir da fila no meio da escrita. */}
            <button className="btn brand" style={{padding:'6px 12px'}} disabled={!naoSalvo}
              onClick={()=>onCampo(it.id,'resposta',resp)}>
              {naoSalvo || !it.resposta ? 'Salvar rascunho' : 'Salvo ✓'}
            </button>
            {/* Quando a IA já disse que o comentário não pede resposta (spam,
                bot, provocação), pedir um rascunho gastaria dinheiro para
                receber de volta exatamente esse "não há o que responder".
                A caixa de texto continua aí para quem discordar e escrever. */}
            {it.ia_triagem !== 'nao_responder' && (
              <button className="btn" style={{padding:'6px 12px'}} disabled={gerando} onClick={gerar}>
                {gerando ? 'Gerando…' : (it.resposta ? 'Gerar de novo' : '✨ Gerar sugestão')}
              </button>
            )}
            <button className="btn" style={{padding:'6px 12px'}} disabled={!resp.trim()} onClick={copiar}>
              {copiado ? 'Copiado ✓' : 'Copiar resposta'}
            </button>
          </div>
          {aviso && <div className="avisoerro">{aviso}</div>}
        </div>

        {/* O que tira o comentário da fila. Separado do rascunho de propósito:
            escrever a resposta e decidir que ela está pronta são dois momentos. */}
        <div className="fluxo">
          {noLixo ? (
            <>
              <button className="btn" style={{padding:'8px 16px'}} onClick={()=>onCampo(it.id,'triagem','Pendente')}>↩ Restaurar</button>
              {confirmando ? (
                <>
                  <span className="confirma">Excluir para sempre? Não dá para desfazer.</span>
                  <button className="btn perigo" style={{padding:'8px 14px'}} onClick={()=>onExcluir(it.id)}>Sim, excluir</button>
                  <button className="btn" style={{padding:'8px 14px'}} onClick={()=>setConfirmando(false)}>Cancelar</button>
                </>
              ) : (
                <button className="btn" style={{padding:'8px 14px',color:'var(--neg)'}} onClick={()=>setConfirmando(true)}>Excluir definitivo</button>
              )}
            </>
          ) : sit === 'Pendente' ? (
            <>
              <button className="btn ok" style={{padding:'8px 18px'}} onClick={()=>onCampo(it.id,'triagem','Respondido')}>✓ Respondi</button>
              <button className="btn" style={{padding:'8px 16px'}} onClick={()=>onCampo(it.id,'triagem','Ignorar')}>Não responder</button>
            </>
          ) : (
            <button className="btn" style={{padding:'8px 16px'}} onClick={()=>onCampo(it.id,'triagem','Pendente')}>↩ Voltar para a fila</button>
          )}
        </div>
      </div>

      <div className="ctrl">
        <div className="sentbox">
          <span className="dot" style={{background: corSent(sent?.nome)}}></span>
          <select value={it.sentimento_id || ''} onChange={e=>onCampo(it.id,'sentimento_id', e.target.value?Number(e.target.value):null)}>
            <option value="">Sentimento…</option>
            {cfg.sentimentos.map(s=><option key={s.id} value={s.id}>{s.nome}</option>)}
          </select>
        </div>
      </div>
    </div>
  );
}

/* ---------- parser de texto colado (portado do Zmetrics) ----------
   O texto copiado da tela do Instagram / Meta Business Suite vem com links
   markdown [texto](url), nomes de usuário, barras de tempo/curtidas e botões.
   A limpeza é estrutural: resolve os links (mantém o texto, descarta a URL);
   tempo = número+unidade; curtidas = número+palavra; e uma linha só é
   descartada se for INTEIRA ruído.

   MARCA é um caractere de controle usado internamente para sinalizar
   "esta linha é um nome de usuário vindo de um link markdown". Escrito como
   String.fromCharCode de proposito: como literal ele fica invisivel no editor. */
const MARCA = String.fromCharCode(1);

const UI_UNIT = /(?:\d+\s*(?:segundos?|minutos?|horas?|dias?|semanas?|mes(?:es)?|m[eê]s|anos?|seg|min|hrs?|sem|s|h|d|m|a|w|y)\b|agora(?:\s+há\s+pouco)?|just\s+now|now|edit(?:ed|ado)?|\d[\d.,]*\s*(?:curtidas?|gostos?|likes?|coment[áa]rios?|respostas?|replies|partilhas?|compartilhamentos?|visualiza[çc][õo]es|views|rea[çc][õo]es|seguidor(?:es)?|followers?)|ver\s+(?:as\s+)?\d*\s*respostas?(?:\s*\(\s*\d+\s*\))?|ocultar\s+respostas?|hide\s+replies|ver\s+tradu[çc][ãa]o|see\s+translation|ver\s+mais|see\s+more|responder|reply|curtir|like|gostar|gosto|message|mensagem|gerenciar|editar|excluir|delete|seguir|follow|partilhar|share|traduzir|verificad\w*|verified)/giu;

function isUiLine(line){
  return line.replace(UI_UNIT, ' ').replace(/[\s·•|—–…]+/gu, '').trim() === '';
}

/* Linha que é SÓ um nome de usuário. É assim que o Instagram Web entrega:
   uma linha com o @, a linha seguinte com o comentário. */
const SO_USUARIO = /^@?([A-Za-z0-9._]{2,30})$/;
/* "handle + texto na mesma linha" só conta como autor quando há @ explícito.
   Sem essa exigência, "Quando o Tesouro Reserva…" virava autor="Quando", e um
   comentário que MENCIONA alguém era atribuído a quem foi mencionado. */
const HANDLE = /^@([A-Za-z0-9._]{2,30})\s+([\s\S]+)$/;

function parsePaste(raw){
  let txt = raw.replace(/\[([^\]]*)\]\([^)]*\)/g, (_, t) => {
    t = (t || '').trim();
    return isUiLine(t) ? ' ' + t + ' ' : '\n' + MARCA + t + '\n';
  });
  txt = txt.replace(/https?:\/\/\S+/g, ' ');
  const lines = txt.split(/\r?\n/)
    .map(l => l.replace(/^[\s>]*[*\-–—•·]+\s*/, '').trim())
    .filter(l => l.length > 0);
  const out = [];
  let pending = null;
  const flush = () => { if(pending){ out.push(pending); pending = null; } };
  for(const line of lines){
    if(line[0] === MARCA){ flush(); pending = {author: line.slice(1).trim(), text: ''}; continue; }
    if(isUiLine(line)) continue;
    if(pending){ pending.text = line; out.push(pending); pending = null; continue; }
    const so = line.match(SO_USUARIO);
    if(so){ pending = {author: so[1], text: ''}; continue; }
    const m = line.match(HANDLE);
    if(m && m[2] && m[2].trim()) out.push({author: m[1], text: m[2].trim()});
    else out.push({author: '', text: line});
  }
  flush();
  return out
    .map(c => ({author: c.author || '', text: (c.text || '').trim()}))
    .filter(c => c.text)
    .map((c, i) => ({id: i + 1, author: c.author, text: c.text}));
}

/* ---------- classificação por IA ----------
   Coletar e classificar são coisas separadas de propósito. Importar não gasta
   nada; classificar gasta — por isso só acontece quando a pessoa manda, vendo
   antes quantos comentários e quanto deve custar. */

// Preços por milhão de tokens. Ajuste se a tabela da Anthropic mudar.
const PRECO_ENTRADA = 3, PRECO_SAIDA = 15;
// Estimativa por comentário, antes de rodar. O prompt de sistema vai uma vez
// por lote de 4, então o custo por comentário já inclui essa fatia.
const CUSTO_ESTIMADO_POR_COMENTARIO = 0.002;

const semAcento = s => (s==null?'':String(s)).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function idPorNome(lista, nome){
  if(!nome) return null;
  const n = semAcento(nome);
  const hit = (lista||[]).find(x => semAcento(x.nome) === n);
  return hit ? hit.id : null;
}
// A IA devolve o produto em minúsculo; o banco guarda o nome de exibição.
const PRODUTO_DA_IA = {selic:'Selic', prefixado:'Prefixado', ipca:'IPCA+', reserva:'Reserva', educa:'Educa+', nenhum:null};

function ClassificarIA({interacoes, clienteNome, onClassificar, onFechar}){
  const [rodando, setRodando] = useState(false);
  const [progresso, setProgresso] = useState({feitos:0, total:0});
  const [resumo, setResumo] = useState(null);

  const [incluirVistos, setIncluirVistos] = useState(false);

  // Quem vai para a IA: por padrão, só quem ela NUNCA viu (ia_em vazio).
  //
  // O critério anterior era "tem algum campo vazio", e isso cobrava de novo
  // pelo mesmo comentário para sempre: a IA deixa campo vazio DE PROPÓSITO
  // quando não há o que preencher — "Boa noite" não fala de produto, spam não
  // ganha rascunho. Esses nunca ficavam "completos", então voltavam em toda
  // rodada. O carimbo ia_em separa "a IA nunca olhou" de "olhou e concluiu que
  // não havia nada a pôr" — exatamente a diferença que o código não sabia ver.
  const nuncaVisto = i => !i.ia_em;
  const faltaAlgo = i => !i.sentimento_id || !i.produto_id || !String(i.resposta||'').trim();
  const alvos = interacoes.filter(i => incluirVistos ? faltaAlgo(i) : nuncaVisto(i));
  const semSent = alvos.filter(i => !i.sentimento_id).length;
  const semResp = alvos.filter(i => !String(i.resposta||'').trim()).length;
  // Quantos a IA já viu mas seguem com buraco — é o que se ganharia pagando de
  // novo. Zero significa que não há nada a recuperar, e a opção nem aparece.
  const vistosComBuraco = interacoes.filter(i => i.ia_em && faltaAlgo(i)).length;
  const custo = (alvos.length * CUSTO_ESTIMADO_POR_COMENTARIO).toFixed(2);

  async function rodar(){
    setRodando(true); setResumo(null); setProgresso({feitos:0, total:alvos.length});
    const r = await onClassificar(alvos, feitos => setProgresso({feitos, total:alvos.length}));
    setRodando(false); setResumo(r);
  }

  return (
    <div className="addwrap" style={{marginBottom:14}}>
      <div style={{fontWeight:600,marginBottom:8}}>Classificar com IA</div>

      {resumo ? (
        <div>
          <div style={{fontSize:13,marginBottom:10,lineHeight:1.6}}>
            <div>{resumo.ok} comentário(s) classificado(s).</div>
            {resumo.juridico > 0 && <div style={{color:'var(--neu)',fontWeight:600}}>⚠️ {resumo.juridico} marcado(s) pela IA como tema sensível — revise antes de responder.</div>}
            {resumo.falhas > 0 && <div style={{color:'var(--neg)'}}>{resumo.falhas} não puderam ser classificados. Pode rodar de novo.</div>}
            {resumo.tokens && <div style={{color:'var(--muted)',fontSize:12,marginTop:6}}>Custo real: US$ {resumo.custoReal} · {resumo.tokens.entrada.toLocaleString('pt-BR')} tokens de entrada, {resumo.tokens.saida.toLocaleString('pt-BR')} de saída</div>}
            {resumo.erro && <div style={{color:'var(--neg)',marginTop:6}}>{resumo.erro}</div>}
          </div>
          <button className="btn" onClick={()=>{setResumo(null); onFechar();}}>Fechar</button>
        </div>
      ) : rodando ? (
        <div style={{fontSize:13}}>
          <div style={{marginBottom:8}}>Classificando {progresso.feitos} de {progresso.total}…</div>
          <div style={{height:6,background:'var(--line)',borderRadius:99,overflow:'hidden'}}>
            <div style={{height:'100%',width:(progresso.total?(progresso.feitos/progresso.total)*100:0)+'%',background:'var(--brand)',transition:'width .2s'}} />
          </div>
          <div style={{color:'var(--muted)',marginTop:8,fontSize:12}}>Não feche a aba até terminar.</div>
        </div>
      ) : (
        <div>
          <div style={{fontSize:13,marginBottom:12,lineHeight:1.6}}>
            <div><b>{alvos.length}</b> comentário(s) podem receber ajuda da IA, do cliente <b>{clienteNome}</b>.</div>
            <div style={{color:'var(--muted)'}}>
              {semSent > 0 && <span>{semSent} sem sentimento</span>}
              {semSent > 0 && semResp > 0 && <span> · </span>}
              {semResp > 0 && <span>{semResp} sem rascunho de resposta</span>}
            </div>
            <div style={{color:'var(--muted)',marginTop:4}}>Custo estimado: <b>US$ {custo}</b>. É estimativa — o valor real aparece ao terminar.</div>
            <div style={{color:'var(--muted)',marginTop:6}}>A IA preenche sentimento, produto e um rascunho de resposta. <b>Só preenche o que está vazio</b> — o sentimento que você definiu à mão fica como está. A triagem (Pendente/Respondido) não é alterada.</div>
            <div style={{color:'var(--muted)',marginTop:6}}>Cada comentário é enviado <b>uma vez só</b>. Quem a IA já analisou não volta na próxima rodada, mesmo que tenha ficado com campo vazio — muitos ficam vazios porque não há o que preencher.</div>
          </div>
          {vistosComBuraco > 0 && (
            <label style={{display:'flex',gap:8,alignItems:'flex-start',fontSize:13,marginBottom:12,cursor:'pointer'}}>
              <input type="checkbox" checked={incluirVistos} onChange={e=>setIncluirVistos(e.target.checked)} style={{marginTop:3}} />
              <span>
                Pagar de novo por {vistosComBuraco} que a IA já analisou e seguem com campo vazio.
                <span style={{color:'var(--muted)'}}> Normalmente não vale: costuma ser comentário sem produto ou spam sem resposta. Use só se achar que a IA errou.</span>
              </span>
            </label>
          )}
          <div style={{display:'flex',gap:8}}>
            <button className="btn brand" disabled={!alvos.length} onClick={rodar}>Classificar {alvos.length}</button>
            <button className="btn" onClick={onFechar}>Cancelar</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- colar em lote ----------
   Duas etapas: colar e revisar. O parser erra às vezes, porque o texto
   copiado da tela varia muito — então nada vai para o banco antes de a
   pessoa conferir como cada comentário foi separado. */
function ColarLote({cfg, clienteId, onAddLote}){
  const [raw, setRaw] = useState('');
  const [linhas, setLinhas] = useState(null);
  const [rede, setRede] = useState('');
  const [origem, setOrigem] = useState('Feed');
  const [link, setLink] = useState('');
  const [salvando, setSalvando] = useState(false);

  function separar(){
    const r = parsePaste(raw);
    if(!r.length){ alert('Não encontrei nenhum comentário nesse texto.'); return; }
    setLinhas(r.map(x => ({...x, link: ''})));
  }
  const upd = (id, campo, valor) => setLinhas(p => p.map(x => x.id===id ? {...x, [campo]:valor} : x));
  const remover = id => setLinhas(p => p.filter(x => x.id !== id));
  // O campo do lote preenche todas as linhas de uma vez; depois cada uma pode
  // ser ajustada. Comentários de posts diferentes — ou DMs, que não têm post —
  // não podem ser forçados a compartilhar o mesmo link.
  const aplicarLinkATodos = valor => { setLink(valor); setLinhas(p => p.map(x => ({...x, link: valor}))); };
  const validas = linhas ? linhas.filter(l => l.text.trim()) : [];

  async function salvar(){
    if(!validas.length){ alert('Nenhum comentário para adicionar.'); return; }
    setSalvando(true);
    const ok = await onAddLote(validas.map(l => ({
      cliente_id: clienteId,
      autor: l.author || null,
      texto: l.text,
      link_conteudo: (l.link || '').trim() || null,
      origem,
      rede_id: rede ? Number(rede) : null,
      produto_id: null, editoria_id: null, sentimento_id: null,
      triagem: 'Pendente'
    })));
    setSalvando(false);
    if(ok){ setRaw(''); setLinhas(null); setLink(''); }
  }

  if(linhas) return (
    <div className="addwrap">
      <div style={{fontWeight:600,marginBottom:4}}>Revisar — {linhas.length} comentário(s)</div>
      <div style={{fontSize:12,color:'var(--muted)',marginBottom:12}}>Confira como cada um foi separado. Corrija o que estiver errado e remova o que não for comentário. Nada foi salvo ainda.</div>
      <div style={{display:'flex',flexDirection:'column',gap:8,maxHeight:320,overflowY:'auto',marginBottom:12}}>
        {linhas.map(l => (
          <div key={l.id} style={{display:'flex',flexDirection:'column',gap:4,paddingBottom:8,borderBottom:'1px solid var(--line)'}}>
            <div style={{display:'flex',gap:8,alignItems:'flex-start'}}>
              <input value={l.author} onChange={e=>upd(l.id,'author',e.target.value)} placeholder="autor" style={{flex:'0 0 150px'}} />
              <textarea value={l.text} onChange={e=>upd(l.id,'text',e.target.value)} style={{flex:1,minHeight:38}} />
              <button className="btn" title="Remover" onClick={()=>remover(l.id)} style={{flex:'none'}}>×</button>
            </div>
            <input value={l.link||''} onChange={e=>upd(l.id,'link',e.target.value)} placeholder="link do post deste comentário (opcional — deixe vazio para DM)" style={{fontSize:12}} />
          </div>
        ))}
      </div>
      <div className="addgrid" style={{marginBottom:12}}>
        <label className="field"><span>Rede (vale para o lote)</span>
          <select value={rede} onChange={e=>setRede(e.target.value)}><option value="">—</option>{cfg.redes.map(r=><option key={r.id} value={r.id}>{r.nome}</option>)}</select></label>
        <label className="field"><span>Origem</span>
          <select value={origem} onChange={e=>setOrigem(e.target.value)}><option>Feed</option><option>DM</option></select></label>
        <label className="field"><span>Link do post — preenche todos de uma vez</span>
          <input value={link} onChange={e=>aplicarLinkATodos(e.target.value)} placeholder="https://… (ajustável linha a linha acima)" /></label>
      </div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn brand" disabled={salvando||!validas.length} onClick={salvar}>{salvando?'Salvando…':'Adicionar '+validas.length+' comentário(s)'}</button>
        <button className="btn" disabled={salvando} onClick={()=>setLinhas(null)}>Voltar</button>
      </div>
    </div>
  );

  return (
    <div className="addwrap">
      <div style={{fontWeight:600,marginBottom:4}}>Colar comentários em lote</div>
      <div style={{fontSize:12,color:'var(--muted)',marginBottom:12}}>Copie o bloco de comentários da tela e cole abaixo. O sistema separa autor e texto e descarta o ruído da interface — tempo, "Responder", curtidas.</div>
      <label className="field" style={{marginBottom:12}}>
        <textarea value={raw} onChange={e=>setRaw(e.target.value)} style={{minHeight:150}} placeholder={'mariana.invest\nQuando o Tesouro Reserva chega no meu banco?\n2 d\nResponder'} /></label>
      <button className="btn brand" disabled={!raw.trim()} onClick={separar}>Separar comentários →</button>
    </div>
  );
}

function Adicionar({cfg, clienteId, onAdd}){
  const vazio = {autor:'',texto:'',link_conteudo:'',origem:'Feed',rede_id:'',produto_id:'',editoria_id:'',sentimento_id:''};
  const [f, setF] = useState(vazio);
  const [salvando, setSalvando] = useState(false);
  const set = (k,v)=>setF(p=>({...p,[k]:v}));
  async function salvar(){
    if(!f.texto.trim()){ alert('Escreva o texto do comentário.'); return; }
    setSalvando(true);
    const ok = await onAdd({
      cliente_id: clienteId, autor: f.autor || null, texto: f.texto, link_conteudo: f.link_conteudo || null, origem: f.origem,
      rede_id: f.rede_id?Number(f.rede_id):null, produto_id: f.produto_id?Number(f.produto_id):null,
      editoria_id: f.editoria_id?Number(f.editoria_id):null, sentimento_id: f.sentimento_id?Number(f.sentimento_id):null, triagem:'Pendente'
    });
    setSalvando(false);
    if(ok) setF(vazio);
  }
  return (
    <div className="addwrap">
      <div style={{fontWeight:600,marginBottom:12}}>Adicionar interação</div>
      <div className="addgrid">

        <label className="field"><span>Editoria</span>
          <select value={f.editoria_id} onChange={e=>set('editoria_id',e.target.value)}><option value="">—</option>{cfg.editorias.map(ed=><option key={ed.id} value={ed.id}>{ed.nome}</option>)}</select></label>
        <label className="field"><span>Sentimento</span>
          <select value={f.sentimento_id} onChange={e=>set('sentimento_id',e.target.value)}><option value="">—</option>{cfg.sentimentos.map(s=><option key={s.id} value={s.id}>{s.nome}</option>)}</select></label>
