function Aprovacoes({clienteId, clienteNome, cfg, perfil}){
  const [itens, setItens] = useState(null);   // null = ainda carregando
  const [erro, setErro] = useState('');
  const [mes, setMes] = useState(mesDeHoje());
  const [f, setF] = useState(APROV_FILTRO_VAZIO);
  const [editando, setEditando] = useState(null);   // null = fechado
  const [verArquivados, setVerArquivados] = useState(false);
  const [verSemData, setVerSemData] = useState(false);
  const [eventos, setEventos] = useState({});       // {conteudoId: [...]}
  const [arquivos, setArquivos] = useState({});     // {conteudoId: [...]}, com link temporário
  // Só id, conteudo_id e tamanho de TODOS os arquivos do cliente: é o que
  // permite mostrar a contagem no botão e o espaço usado sem abrir cada peça.
  const [todosArquivos, setTodosArquivos] = useState([]);
  const [ocupado, setOcupado] = useState(false);
  const [avisoArq, setAvisoArq] = useState('');

  const quem = (perfil && perfil.nome) || 'equipe';

  useEffect(()=>{
    let cancelado = false;
    (async ()=>{
      setErro(''); setItens(null);
      if(!clienteId){ if(!cancelado) setItens([]); return; }
      const { data, error } = await sb.from('conteudos').select('*')
        .eq('cliente_id', clienteId).order('data_prevista', {ascending:true});
      if(cancelado) return;
      if(error){ setErro(aprovErro(error.message)); setItens([]); return; }
      setItens(data || []);
      // A ficha dos arquivos, sem o conteúdo deles: é o suficiente para o
      // número no botão e para a conta de espaço, e custa uma consulta só.
      const ids = (data || []).map(c => c.id);
      if(ids.length){
        const arq = await sb.from('conteudo_arquivos').select('id,conteudo_id,tamanho').in('conteudo_id', ids);
        if(!cancelado) setTodosArquivos(arq.error ? [] : (arq.data || []));
      } else if(!cancelado) setTodosArquivos([]);
    })();
    // Trocar de cliente no meio de um carregamento fazia a lista do cliente
    // anterior chegar depois e sobrescrever a certa.
    return ()=>{ cancelado = true; };
  }, [clienteId]);

  /* Toda mudança de status grava DUAS coisas: o novo estado na peça e uma
     linha no histórico. O histórico nunca é apagado — é o que responde
     "quem mandou isso para o cliente, e quando?". */
  async function aoMudar(c, para){
    const de = c.status || 'rascunho';
    if(de === para) return;
    const mud = {status: para, atualizado_em: new Date().toISOString()};
    const { error } = await sb.from('conteudos').update(mud).eq('id', c.id);
    if(error){ setErro('Não consegui salvar: ' + error.message); return; }
    const ev = await sb.from('conteudo_eventos')
      .insert({conteudo_id: c.id, de, para, quem}).select().single();
    setErro('');
    setItens(prev => (prev||[]).map(x => x.id === c.id ? {...x, ...mud} : x));
    // Mantém o histórico aberto coerente sem ir ao banco de novo.
    if(!ev.error && eventos[c.id]) setEventos(p => ({...p, [c.id]: [ev.data, ...p[c.id]]}));
  }

  async function aoArquivar(c, valor){
    const { error } = await sb.from('conteudos')
      .update({arquivado: valor, atualizado_em: new Date().toISOString()}).eq('id', c.id);
    if(error){ setErro('Não consegui salvar: ' + error.message); return; }
    setErro('');
    setItens(prev => (prev||[]).map(x => x.id === c.id ? {...x, arquivado: valor} : x));
  }

  async function verHistorico(id){
    if(eventos[id] !== undefined) return;
    setEventos(p => ({...p, [id]: undefined}));
    const { data, error } = await sb.from('conteudo_eventos').select('*')
      .eq('conteudo_id', id).order('criado_em', {ascending:false});
    setEventos(p => ({...p, [id]: error ? [] : (data || [])}));
  }

  /* ---------- ARQUIVOS ----------
     A área é fechada, então nenhum arquivo tem endereço fixo: para cada um
     se pede uma "chave de visita" que vale uma hora. É o preço de a arte
     não vazar antes da campanha. */
  async function comLink(linhas){
    const caminhos = (linhas || []).map(a => a.caminho).filter(Boolean);
    if(!caminhos.length) return linhas || [];
    const { data, error } = await sb.storage.from(ARQ_BALDE).createSignedUrls(caminhos, ARQ_VALIDADE);
    if(error) return linhas;
    // O Supabase devolve na mesma ordem que recebeu, mas casar por caminho
    // é mais seguro do que confiar nisso.
    const porCaminho = {};
    (data || []).forEach(d => { if(d && d.path) porCaminho[d.path] = d.signedUrl; });
    return linhas.map(a => ({...a, link: porCaminho[a.caminho] || null}));
  }

  async function verArquivos(id){
    if(arquivos[id] !== undefined) return;
    setArquivos(p => ({...p, [id]: undefined}));
    const { data, error } = await sb.from('conteudo_arquivos').select('*')
      .eq('conteudo_id', id).order('ordem', {ascending:true});
    if(error){ setAvisoArq(aprovErro(error.message)); setArquivos(p => ({...p, [id]: []})); return; }
    const comUrl = await comLink(data || []);
    setArquivos(p => ({...p, [id]: comUrl}));
  }

  async function subirArquivos(c, escolhidos){
    if(!escolhidos || !escolhidos.length) return;
    setAvisoArq(''); setOcupado(true);
    // A ordem continua de onde parou, para o card novo entrar no fim do
    // carrossel em vez de embaralhar o que já estava montado.
    const atuais = arquivos[c.id] || [];
    let proxima = atuais.reduce((m, a) => Math.max(m, (a.ordem || 0) + 1), 0);
    const recusados = [];
    const novos = [];

    for(const f of escolhidos){
      const ok = arquivoAceito(f);
      if(!ok.ok){ recusados.push(ok.motivo); continue; }
      const caminho = caminhoDoArquivo(clienteId, c.id, f.name);
      const up = await sb.storage.from(ARQ_BALDE).upload(caminho, f, {contentType: f.type});
      if(up.error){ recusados.push(`"${f.name}": ${up.error.message}`); continue; }
      const { data, error } = await sb.from('conteudo_arquivos').insert({
        conteudo_id: c.id, versao: c.versao || 1, tipo: ok.tipo, caminho,
        nome: f.name, tamanho: f.size, ordem: proxima++,
      }).select().single();
      if(error){
        // Gravou o arquivo mas não a ficha dele: sem isso ficaria um arquivo
        // órfão ocupando espaço que ninguém consegue ver nem apagar.
        await sb.storage.from(ARQ_BALDE).remove([caminho]);
        recusados.push(`"${f.name}": ${error.message}`);
        continue;
      }
      novos.push(data);
    }

    if(novos.length){
      const comUrl = await comLink(novos);
      setArquivos(p => ({...p, [c.id]: [...(p[c.id] || []), ...comUrl]}));
      setTodosArquivos(p => [...p, ...novos.map(a => ({id:a.id, conteudo_id:a.conteudo_id, tamanho:a.tamanho}))]);
    }
    setOcupado(false);
    if(recusados.length) setAvisoArq(recusados.join(' · '));
  }

  async function moverArquivo(c, id, direcao){
    const nova = trocarOrdem(arquivos[c.id] || [], id, direcao);
    if(!nova) return;   // já está na ponta
    setOcupado(true);
    setArquivos(p => ({...p, [c.id]: nova}));   // a tela responde na hora
    for(const a of nova){
      const antes = (arquivos[c.id] || []).find(x => x.id === a.id);
      if(antes && antes.ordem === a.ordem) continue;   // não grava o que não mudou
      const { error } = await sb.from('conteudo_arquivos').update({ordem: a.ordem}).eq('id', a.id);
      if(error){ setAvisoArq('Não consegui salvar a ordem: ' + error.message); break; }
    }
    setOcupado(false);
  }

  async function removerArquivo(c, a){
    setOcupado(true); setAvisoArq('');
    // A ficha sai primeiro. Se o arquivo em si resistir, sobra um arquivo
    // invisível ocupando espaço — chato, mas melhor que uma ficha apontando
    // para um arquivo que não existe mais, que quebraria a prévia.
    const { error } = await sb.from('conteudo_arquivos').delete().eq('id', a.id);
    if(error){ setAvisoArq('Não consegui remover: ' + error.message); setOcupado(false); return; }
    if(a.caminho) await sb.storage.from(ARQ_BALDE).remove([a.caminho]);
    const restantes = (arquivos[c.id] || []).filter(x => x.id !== a.id)
      .map((x, n) => ({...x, ordem: n}));
    setArquivos(p => ({...p, [c.id]: restantes}));
    setTodosArquivos(p => p.filter(x => x.id !== a.id));
    for(const x of restantes) await sb.from('conteudo_arquivos').update({ordem: x.ordem}).eq('id', x.id);
    setOcupado(false);
  }

  // Campo vazio na tela tem que virar null no banco, não string vazia:
  // "" numa coluna de número quebra o insert, e "" numa data também.
  function limpar(f){
    const n = v => (v === '' || v === undefined) ? null : v;
    return {
      titulo: n(f.titulo), formato: n(f.formato),
      rede_id: f.rede_id ? Number(f.rede_id) : null,
      produto_id: f.produto_id ? Number(f.produto_id) : null,
      editoria_id: f.editoria_id ? Number(f.editoria_id) : null,
      data_prevista: n(f.data_prevista), hora_prevista: n(f.hora_prevista),
      legenda: n(f.legenda), hashtags: n(f.hashtags), cta: n(f.cta),
      campanha: n(f.campanha), observacoes: n(f.observacoes), responsavel: n(f.responsavel),
    };
  }

  async function salvar(form){
    const payload = limpar(form);
    if(editando && editando.id){
      const mud = {...payload, atualizado_em: new Date().toISOString()};
      const { error } = await sb.from('conteudos').update(mud).eq('id', editando.id);
      if(error) return {erro: 'Não consegui salvar: ' + error.message};
      setItens(prev => (prev||[]).map(x => x.id === editando.id ? {...x, ...mud} : x));
    } else {
      const { data, error } = await sb.from('conteudos')
        .insert({...payload, cliente_id: clienteId, status:'rascunho'}).select().single();
      if(error) return {erro: 'Não consegui salvar: ' + error.message};
      await sb.from('conteudo_eventos').insert({conteudo_id: data.id, de: null, para: 'rascunho', quem});
      setItens(prev => [...(prev||[]), data]);
      // Cadastrou para outro mês? Leva a tela até lá, senão a peça "some".
      const m = mesDe(data.data_prevista);
      if(m && m !== mes) setMes(m);
    }
    setEditando(null);
    return {};
  }

  async function duplicar(c){
    const copia = limpar({...c, titulo: c.titulo ? c.titulo + ' (cópia)' : null});
    const { data, error } = await sb.from('conteudos')
      .insert({...copia, cliente_id: clienteId, status:'rascunho'}).select().single();
    if(error){ setErro('Não consegui duplicar: ' + error.message); return; }
    await sb.from('conteudo_eventos').insert({conteudo_id: data.id, de: null, para: 'rascunho', quem});
    setErro('');
    setItens(prev => [...(prev||[]), data]);
  }

  const todos = itens || [];
  const semData  = todos.filter(c => !mesDe(c.data_prevista) && !c.arquivado);
  const doMes    = todos.filter(c => mesDe(c.data_prevista) === mes);
  const base     = verSemData ? semData : doMes;
  const naLista  = base.filter(c => verArquivados ? c.arquivado : !c.arquivado);
  const vis      = naLista.filter(c => passaAprov(c, f, cfg));
  const resumo   = resumoAprovacao(doMes);
  const filtrando = Object.keys(APROV_FILTRO_VAZIO).some(k => f[k] !== APROV_FILTRO_VAZIO[k]);
  const arquivados = base.filter(c => c.arquivado).length;
  const espaco = espacoUsado(todosArquivos);
  const p = (k, v) => setF({...f, [k]: v});

  return (
    <div>
      <div className="head">
        <div>
          <h1>Aprovação de Conteúdo</h1>
          <p>{clienteNome} · planejamento e aprovação das peças antes de publicar</p>
        </div>
        <div style={{display:'flex',gap:8,flexShrink:0}}>
          <button className="btn brand" onClick={()=>setEditando(editando ? null : {})}>
            {editando ? 'Fechar' : '+ Novo conteúdo'}
          </button>
        </div>
      </div>

      {erro && <div className="avisoerro" style={{marginBottom:14}}>{erro}</div>}

      <div className="mesbar">
        <button className="btn" onClick={()=>{setMes(mesVizinho(mes,-1)); setVerSemData(false);}}>‹</button>
        <div className="mesnome">{nomeDoMes(mes)}</div>
        <button className="btn" onClick={()=>{setMes(mesVizinho(mes,1)); setVerSemData(false);}}>›</button>
        {mes !== mesDeHoje() &&
          <button className="btn" onClick={()=>{setMes(mesDeHoje()); setVerSemData(false);}}>hoje</button>}
      </div>

      {itens === null ? (
        <div className="empty">Carregando…</div>
      ) : erro ? null : (
        <>
          {/* O painel e os filtros só aparecem quando há o que contar e o que
              filtrar. Num mês vazio, cinco cartões escritos "0" e cinco
              seletores de nada só atrapalham a única coisa que importa ali:
              o botão de criar a primeira peça. */}
          {naLista.length > 0 && <>
          {/* O painel do mês. A barra mostra a fração aprovada do mês inteiro,
              não da lista filtrada — filtrar não pode mudar o andamento real. */}
          <div className="cards">
            <div className="card"><div className="lbl">Conteúdos no mês</div><div className="val">{resumo.total}</div></div>
            <div className="card"><div className="lbl">Aprovados</div><div className="val" style={{color:'#1E9E6A'}}>{resumo.aprovados}</div></div>
            <div className="card"><div className="lbl">Com o cliente</div><div className="val" style={{color:'#185FA5'}}>{resumo.aguardando}</div></div>
            <div className="card"><div className="lbl">Em ajuste</div><div className="val" style={{color: resumo.ajuste ? 'var(--neg)' : 'inherit'}}>{resumo.ajuste}</div></div>
            <div className="card"><div className="lbl">Ainda internos</div><div className="val">{resumo.interno}</div></div>
          </div>

          <div className="progresso">
            <div className="trilho"><div className="cheio" style={{width:(resumo.pct || 0)+'%'}} /></div>
            <div className="pctxt">
              {resumo.pct === null
                ? 'Nada planejado para este mês ainda.'
                : `${resumo.pct}% do mês aprovado — ${resumo.aprovados} de ${resumo.total}.`}
            </div>
          </div>
          </>}

          {/* Os avisos continuam valendo com o mês vazio — o de "sem data
              prevista" justamente mais ainda: é quando a peça escondida é a
              única que existe. */}
          {resumo.aguardando > 0 && (
            <div className="aviso">{resumo.aguardando} conteúdo(s) aguardando resposta do cliente.</div>
          )}
          {resumo.ajuste > 0 && (
            <div className="aviso">{resumo.ajuste} conteúdo(s) com ajuste pedido — precisam de revisão.</div>
          )}
          {/* Peça sem data não aparece em mês nenhum. Avisar é obrigatório:
              sem isto, ela some da vista e ninguém sabe que existe. */}
          {semData.length > 0 && !verSemData && (
            <div className="aviso">
              {semData.length} conteúdo(s) <b>sem data prevista</b> não aparecem em nenhum mês.{' '}
              <button className="linkbtn" onClick={()=>setVerSemData(true)}>ver esses</button>
            </div>
          )}
          {verSemData && (
            <div className="aviso">
              Mostrando os conteúdos <b>sem data prevista</b>.{' '}
              <button className="linkbtn" onClick={()=>setVerSemData(false)}>voltar para {nomeDoMes(mes)}</button>
            </div>
          )}

          {editando && (
            <FormConteudo inicial={editando} cfg={cfg}
              aoSalvar={salvar} aoCancelar={()=>setEditando(null)} />
          )}

          {naLista.length > 0 && (
          <div className="filtros">
            <div className="chips">
              <button className={"chip"+(f.status===''?' on':'')} onClick={()=>p('status','')}>
                Todos<span className="n">{naLista.length}</span>
              </button>
              {Object.entries(APROV_STATUS).map(([id, s]) => {
                const n = naLista.filter(c => (c.status||'rascunho') === id).length;
                if(!n && f.status !== id) return null;
                return (
                  <button key={id} className={"chip"+(f.status===id?' on':'')} onClick={()=>p('status',id)}>
                    {s.rotulo}<span className="n">{n}</span>
                  </button>
                );
              })}
              {arquivados > 0 && (
                <button className={"chip"+(verArquivados?' on':'')} onClick={()=>setVerArquivados(!verArquivados)}>
                  Arquivados<span className="n">{arquivados}</span>
                </button>
              )}
            </div>
            <div className="filters">
              <input value={f.busca} onChange={e=>p('busca', e.target.value)}
                placeholder="Buscar por título, legenda, hashtag ou campanha…" />
              <select value={f.rede} onChange={e=>p('rede', e.target.value)}>
                <option value="">Rede: todas</option>
                {cfg.redes.map(r => <option key={r.id} value={String(r.id)}>{r.nome}</option>)}
              </select>
              <select value={f.formato} onChange={e=>p('formato', e.target.value)}>
                <option value="">Formato: todos</option>
                {APROV_FORMATOS.map(x => <option key={x} value={x}>{x}</option>)}
              </select>
              <select value={f.editoria} onChange={e=>p('editoria', e.target.value)}>
                <option value="">Editoria: todas</option>
                {cfg.editorias.map(x => <option key={x.id} value={String(x.id)}>{x.nome}</option>)}
              </select>
              <select value={f.produto} onChange={e=>p('produto', e.target.value)}>
                <option value="">Produto: todos</option>
                {cfg.produtos.map(x => <option key={x.id} value={String(x.id)}>{x.nome}</option>)}
              </select>
              {filtrando && <button className="btn" onClick={()=>setF(APROV_FILTRO_VAZIO)}>Limpar filtros</button>}
            </div>
          </div>
          )}

          {vis.length === 0 ? (
            naLista.length === 0 ? (
              <div className="soon">
                <div style={{fontSize:16,fontWeight:600,color:'var(--ink)'}}>
                  {verArquivados ? 'Nada arquivado aqui.'
                    : verSemData ? 'Nenhum conteúdo sem data.'
                    : `Nenhum conteúdo planejado para ${nomeDoMes(mes)}`}
                </div>
                {!verArquivados && !verSemData &&
                  <div style={{marginTop:6}}>Clique em <b>+ Novo conteúdo</b> para montar o mês.</div>}
              </div>
            ) : (
              <div className="empty">
                Nenhum conteúdo corresponde ao que você filtrou.{' '}
                <button className="linkbtn" onClick={()=>setF(APROV_FILTRO_VAZIO)}>limpar</button>
              </div>
            )
          ) : vis.map(c => (
            <CartaoConteudo key={c.id} c={c} cfg={cfg} eventos={eventos[c.id]}
              aoMudar={aoMudar} aoEditar={x=>setEditando(x)} aoDuplicar={duplicar}
              aoArquivar={aoArquivar} aoVerHistorico={verHistorico}
              arquivos={arquivos[c.id]} aoVerArquivos={verArquivos}
              aoSubir={subirArquivos} aoMover={moverArquivo} aoRemover={removerArquivo}
              espaco={espaco} ocupado={ocupado} avisoArq={avisoArq}
              quantosArquivos={todosArquivos.filter(a => a.conteudo_id === c.id).length} />
          ))}
        </>
      )}
    </div>
  );
}

/* O erro do banco em linguagem de gente. Mesma ideia da tela Manhã:
   "relation does not exist" não diz nada para quem não é programador, e a
   saída é sempre a mesma — rodar o guia de migração. */
function aprovErro(msg){
  const m = String(msg || '');
  if(/conteudo|aprovacao_link/.test(m) && /does not exist|not find|schema cache/i.test(m)){
    return 'As tabelas do módulo de Aprovação ainda não existem no banco. Rode o guia MIGRACAO-APROVACAO.md — leva uns 3 minutos.';
  }
  return m;
}

/* ============================================================
   MANHÃ — o que chegou desde ontem, com sugestão pronta

   Esta tela NÃO ENVIA NADA. Não existe aqui — nem em nenhum outro canto do
   MUVUCA — ligação de envio para o Instagram. O que ela faz é juntar o que
   chegou, mostrar uma sugestão de resposta e deixar copiar. Quem manda é uma
   pessoa, com o texto na mão, olhando a conversa.

   "Marcar como respondido" quer dizer "eu já respondi lá", não "o sistema
   respondeu". É uma fila de leitura.
   ============================================================ */

const MANHA_SITUACOES = {
  pendente:   {rotulo:'Na fila',    cor:'var(--neu)'},
  respondido: {rotulo:'Respondido', cor:'#1E9E6A'},
  ignorado:   {rotulo:'Ignorado',   cor:'var(--bot)'},
};

const MANHA_FILTRO_VAZIO = {origem:'', status:'pendente', escalar:false};

/* Puras e fora do componente, para poderem ser testadas sem navegador. */
function manhaPassa(it, f){
  if(f.origem  && (it.source||'feed') !== f.origem)  return false;
  if(f.status  && (it.status||'pendente') !== f.status) return false;
  if(f.escalar && !it.escalate)                      return false;
  return true;
}

/* Conta SÓ o que ainda está na fila. Somar respondido e ignorado junto faria
   o aviso do topo crescer para sempre e nunca voltar a zero — e número que
   nunca zera ninguém olha. */
function manhaResumo(itens){
  const fila = (itens||[]).filter(i => (i.status||'pendente') === 'pendente');
  return {
    feed:    fila.filter(i => (i.source||'feed') === 'feed').length,
    dm:      fila.filter(i => i.source === 'dm').length,
    escalar: fila.filter(i => i.escalate).length,
    total:   fila.length,
  };
}

function manhaTitulo(r){
  if(!r.total) return 'Nada novo hoje 💙';
  return 'Novidades desde ontem — ' +
    [ r.feed === 1 ? '1 comentário' : r.feed + ' comentários',
      r.dm   === 1 ? '1 DM'         : r.dm   + ' DMs',
      r.escalar === 1 ? '1 para escalar' : r.escalar + ' para escalar',
    ].join(' · ');
}

/* O erro do banco em linguagem de gente. "relation does not exist" não diz
   nada para quem não é programador — e a saída, aqui, é sempre a mesma:
   rodar o guia de migração. */
function manhaErro(msg){
  const m = String(msg || '');
  if(/manha_items/.test(m) && /does not exist|not find|schema cache/i.test(m)){
    return 'A tabela da tela Manhã ainda não existe no banco. Rode o guia MIGRACAO-MANHA.md — leva uns 3 minutos.';
  }
  return m;
}

function LinhaManha({it, aoMudar}){
  const [resp, setResp] = useState(it.reply || '');
  const [copiado, setCopiado] = useState(false);
  const [aviso, setAviso] = useState('');
  useEffect(()=>{ setResp(it.reply || ''); },[it.reply]);

  const status = it.status || 'pendente';
  const sit = MANHA_SITUACOES[status] || MANHA_SITUACOES.pendente;
  const lab = it.label || {};
  const iaRec = IA_TRIAGEM[lab.triagem];
  const editado = resp !== (it.reply || '');

  /* Copiar também guarda o texto ajustado. Sem isso, quem corrigisse a
     sugestão perderia a correção ao recarregar a página — e descobriria
     tarde, sem entender por quê. */
  async function copiar(){
    try{
      await navigator.clipboard.writeText(resp);
      setCopiado(true); setTimeout(()=>setCopiado(false), 1600);
      if(editado) aoMudar(it.id, {reply: resp});
    }catch(e){
      setAviso('O navegador bloqueou a cópia. Selecione o texto e use Ctrl+C.');
    }
  }

  return (
    <div className="row" style={{borderLeft:`3px solid ${sit.cor}`, paddingLeft:11,
      opacity: status === 'pendente' ? 1 : .75}}>
      <div className="av">{iniciais(it.author)}</div>
      <div className="body">
        <div className="meta">
          <span className="who">{it.author || 'Sem autor'}</span>
          <span className="tag">{it.source === 'dm' ? 'DM' : 'Feed'}</span>
          <span style={{fontSize:11,fontWeight:700,color:sit.cor}}>{sit.rotulo}</span>
          {it.url && /^https?:\/\//i.test(it.url) &&
            <a href={it.url} target="_blank" rel="noopener noreferrer"
               style={{fontSize:12,color:'#185FA5'}}>abrir no Instagram ↗</a>}
        </div>

        <div className="txt">{it.text || '(mensagem sem texto)'}</div>

        {(iaRec || lab.needsLegal || lab.motivo) && (
          <div className="iatags">
            {iaRec && <span className="pill" style={{color:iaRec.cor, borderColor:iaRec.cor+'55', background:iaRec.cor+'14'}}>{iaRec.label}</span>}
            {lab.needsLegal && <span className="pill" style={{color:'#B5852A', borderColor:'#B5852A55', background:'#B5852A14'}}>Jurídico/STN</span>}
            {lab.motivo && <span className="motivo">· {lab.motivo}</span>}
          </div>
        )}

        {/* Ou o bloco vermelho, ou a resposta. Nunca os dois: mostrar um texto
            pronto ao lado de "isto precisa escalar" é convite para mandar
            assim mesmo. */}
        {it.escalate ? (
          <div className="escalar">
            <div className="titulo">ESCALAR</div>
            <div className="motivo">{it.escalate_reason || 'motivo não informado'}</div>
            <div className="oque">Não há resposta sugerida para este caso, de propósito. Leve para quem decide antes de responder qualquer coisa.</div>
          </div>
        ) : (
          <div className="reply">
            <div className="lblcampo">Resposta sugerida — leia, ajuste e copie</div>
            <textarea value={resp} onChange={e=>setResp(e.target.value)}
              placeholder="Sem sugestão para esta mensagem. Escreva a sua." />
            <div className="acoes">
              <button className="btn brand" style={{padding:'6px 12px'}}
                disabled={!resp.trim()} onClick={copiar}>
                {copiado ? 'Copiado ✓' : 'Copiar'}
              </button>
              {editado && <span style={{fontSize:12,color:'var(--muted)',alignSelf:'center'}}>o texto ajustado é salvo ao copiar</span>}
            </div>
            {aviso && <div className="avisoerro">{aviso}</div>}
          </div>
        )}

        <div className="fluxo">
          {status === 'pendente' ? (
            <>
              <button className="btn ok" style={{padding:'8px 18px'}}
                onClick={()=>aoMudar(it.id, {status:'respondido', ...(editado?{reply:resp}:{})})}>
                ✓ Marcar como respondido
              </button>
              <button className="btn" style={{padding:'8px 16px'}}
                onClick={()=>aoMudar(it.id, {status:'ignorado'})}>Ignorar</button>
            </>
          ) : (
            <button className="btn" style={{padding:'8px 16px'}}
              onClick={()=>aoMudar(it.id, {status:'pendente'})}>↩ Voltar para a fila</button>
          )}
        </div>
      </div>
    </div>
  );
}

function Manha({clienteId, clienteNome}){
  // null é "ainda não sei", [] é "sei que não tem nada". Misturar os dois faz
  // a tela dizer "nada novo" enquanto o banco ainda está respondendo.
  const [itens, setItens] = useState(null);
  const [erro, setErro] = useState('');
  const [f, setF] = useState(MANHA_FILTRO_VAZIO);

  useEffect(()=>{
    let cancelado = false;
    (async ()=>{
      setErro(''); setItens(null);
      if(!clienteId){ if(!cancelado) setItens([]); return; }
      const { data, error } = await sb.from('manha_items').select('*')
        .eq('cliente_id', clienteId).order('created_at', {ascending:false});
      if(cancelado) return;
      if(error){ setErro(manhaErro(error.message)); setItens([]); return; }
      setItens(data || []);
    })();
    // Trocar de cliente no meio de um carregamento fazia a lista do cliente
    // anterior chegar depois e sobrescrever a certa.
    return ()=>{ cancelado = true; };
  }, [clienteId]);

  async function aoMudar(id, mud){
    const { error } = await sb.from('manha_items').update(mud).eq('id', id);
    if(error){ setErro('Não consegui salvar: ' + error.message); return; }
    setErro('');
    setItens(p => (p||[]).map(x => x.id === id ? {...x, ...mud} : x));
  }

  const p = (k,v) => setF({...f, [k]:v});
  const resumo = manhaResumo(itens || []);
  const vis = (itens || []).filter(i => manhaPassa(i, f));
  const filtrando = Object.keys(MANHA_FILTRO_VAZIO)
    .some(k => f[k] !== MANHA_FILTRO_VAZIO[k]);

  return (
    <div>
      <div className="head">
        <div>
          {/* Com erro na tela, o título NÃO pode dizer "Nada novo hoje": a
              lista veio vazia porque a consulta falhou, não porque não há
              novidade. Seriam duas afirmações contraditórias na mesma tela,
              e a tranquilizadora é a que se lê primeiro. */}
          <h1>{(itens === null || erro) ? 'Manhã' : manhaTitulo(resumo)}</h1>
          <p>{clienteNome}{' · '}o MUVUCA sugere; quem responde é você</p>
        </div>
      </div>

      {erro && <div className="avisoerro" style={{marginBottom:14}}>{erro}</div>}

      {itens === null ? (
        <div className="empty">Carregando…</div>
      ) : itens.length === 0 && !erro ? (
        <div className="soon">
          <div style={{fontSize:16,fontWeight:600,color:'var(--ink)'}}>Nada novo hoje 💙</div>
          <div style={{marginTop:6}}>Quando a varredura trouxer comentários e DMs novos, eles aparecem aqui já com uma sugestão de resposta.</div>
        </div>
      ) : (
        <>
          <div className="cards">
            <div className="card"><div className="lbl">Na fila</div><div className="val">{resumo.total}</div></div>
            <div className="card"><div className="lbl">Comentários</div><div className="val">{resumo.feed}</div></div>
            <div className="card"><div className="lbl">DMs</div><div className="val">{resumo.dm}</div></div>
            <div className="card"><div className="lbl">Para escalar</div><div className="val" style={{color: resumo.escalar ? 'var(--neg)' : 'inherit'}}>{resumo.escalar}</div></div>
          </div>

          <div className="filtros">
            <div className="chips">
              <button className={"chip"+(f.origem===''?' on':'')} onClick={()=>p('origem','')}>Tudo</button>
              <button className={"chip"+(f.origem==='feed'?' on':'')} onClick={()=>p('origem','feed')}>Comentários</button>
              <button className={"chip"+(f.origem==='dm'?' on':'')} onClick={()=>p('origem','dm')}>DMs</button>
              <span style={{width:10}} />
              <button className={"chip"+(f.status==='pendente'?' on':'')} onClick={()=>p('status','pendente')}>Na fila</button>
              <button className={"chip"+(f.status==='respondido'?' on':'')} onClick={()=>p('status','respondido')}>Respondidos</button>
              <button className={"chip"+(f.status==='ignorado'?' on':'')} onClick={()=>p('status','ignorado')}>Ignorados</button>
              <button className={"chip"+(f.status===''?' on':'')} onClick={()=>p('status','')}>Todos</button>
              <span style={{width:10}} />
              <button className={"chip juri"+(f.escalar?' on':'')} onClick={()=>p('escalar',!f.escalar)}>
                Só para escalar{resumo.escalar>0 && <span className="n">{resumo.escalar}</span>}
              </button>
              {filtrando && <button className="chip" onClick={()=>setF(MANHA_FILTRO_VAZIO)}>limpar filtros</button>}
            </div>
          </div>

          {vis.length === 0
            ? <div className="empty">Nenhuma novidade com esses filtros. <button className="linkbtn" onClick={()=>setF(MANHA_FILTRO_VAZIO)}>limpar</button></div>
            : vis.map(it => <LinhaManha key={it.id} it={it} aoMudar={aoMudar} />)}
        </>
      )}
    </div>
  );
}

function Community({cfg, interacoes, clienteId, clienteNome, onCampo, onAdd, onAddLote, onClassificar, onGerarResposta, onExcluir}){
  const [aba, setAba] = useState('comentarios');
  const [busca, setBusca] = useState('');
  const [f, setF] = useState(FILTRO_VAZIO);
  const [mostrarAdd, setMostrarAdd] = useState(false);
  const [mostrarColar, setMostrarColar] = useState(false);
  const [mostrarIA, setMostrarIA] = useState(false);

  // Tudo que não está na lixeira. É esta lista que alimenta estatísticas, IA e
  // histórico — o que foi jogado fora não deve pesar em conta nenhuma.
  const vivos = interacoes.filter(i => !naLixeira(i));

  // O número no botão é quantos a IA ainda NÃO analisou — o que ela tem de
  // novo para fazer. Contar "campos vazios" mostrava 29 quando havia 3 novos,
  // e o número só crescia, porque campo vazio de propósito nunca se resolve.
  const semClass = vivos.filter(i => !i.ia_em).length;
  // O botão continua clicável quando não há novidade mas sobrou algum buraco:
  // é por ele que se chega à opção de pagar de novo por aqueles. Sem isso, o
  // botão ficaria cinza e a opção ficaria inalcançável.
  const podeIA = semClass > 0 || vivos.some(i => !i.sentimento_id || !i.produto_id || !String(i.resposta||'').trim());
  const nomeSent = it => cfg.sentimentos.find(s=>s.id===it.sentimento_id)?.nome;
  const total = vivos.length;
  const pend = vivos.filter(i=>(i.triagem||'Pendente')==='Pendente').length;
  const duv = vivos.filter(i=>nomeSent(i)==='Dúvida').length;
  const neg = vivos.filter(i=>nomeSent(i)==='Negativo').length;

  // Quantos há em cada aba, para o número ao lado do nome.
  const daAba = a => a.sit === null ? vivos : interacoes.filter(i => (i.triagem||'Pendente') === a.sit);
  const abaAtual = ABAS.find(a => a.id === aba) || ABAS[0];

  // Os filtros valem dentro da aba aberta: filtrar "Negativos" na aba
  // Respondidos tem que dar os negativos já respondidos, não o acervo todo.
  const naAba = daAba(abaAtual);
  const vis = naAba.filter(i => passaNoFiltro(i, f, busca));
  const filtrando = !!busca || Object.keys(FILTRO_VAZIO).some(k => f[k] !== FILTRO_VAZIO[k]);
  return (
    <div>
      <div className="head">
        <div><h1>Community management</h1><p>Comentários e DMs</p></div>
        <div style={{display:'flex',gap:8,flexShrink:0}}>
          <button className="btn" disabled={!podeIA} title={podeIA?'':'A IA já analisou todos os comentários'} onClick={()=>{setMostrarIA(!mostrarIA); setMostrarAdd(false); setMostrarColar(false);}}>{mostrarIA?'Fechar':'Classificar com IA'+(semClass?' ('+semClass+')':'')}</button>
          {/* Exporta o que está na tela — a aba aberta com os filtros ligados.
              O número no botão deixa isso explícito: exportar em silêncio o
              acervo inteiro quando a pessoa filtrou três comentários seria
              surpresa desagradável na planilha. */}
          <button className="btn" disabled={!vis.length}
            title={vis.length ? 'Baixa os comentários que estão na tela' : 'Nada para exportar'}
            onClick={()=>baixarCSV(paraCSV(vis, cfg),
              `muvuca_${abaAtual.id}_${new Date().toISOString().slice(0,10)}.csv`)}>
            Exportar {vis.length}
          </button>
          <button className="btn" onClick={()=>{setMostrarColar(!mostrarColar); setMostrarAdd(false); setMostrarIA(false);}}>{mostrarColar?'Fechar':'Colar em lote'}</button>
          <button className="btn brand" onClick={()=>{setMostrarAdd(!mostrarAdd); setMostrarColar(false);}}>{mostrarAdd?'Fechar':'+ Adicionar'}</button>
        </div>
      </div>
      <div className="cards">
        <div className="card"><div className="lbl">Total</div><div className="val">{total}</div></div>
        <div className="card"><div className="lbl">Pendentes</div><div className="val">{pend}</div></div>
        <div className="card"><div className="lbl">Dúvidas</div><div className="val">{duv}</div></div>
        <div className="card"><div className="lbl">Negativos</div><div className="val">{neg}</div></div>
      </div>
      {/* A lista de alvos da IA exclui a lixeira: não se paga para classificar
          o que foi jogado fora. */}
      {mostrarIA && <ClassificarIA interacoes={vivos} clienteNome={clienteNome} onClassificar={onClassificar} onFechar={()=>setMostrarIA(false)} />}
      {mostrarColar && <ColarLote cfg={cfg} clienteId={clienteId} onAddLote={onAddLote} />}
      {mostrarAdd && <Adicionar cfg={cfg} clienteId={clienteId} onAdd={onAdd} />}

      <div className="abas">
        {ABAS.map(a=>{
          const n = daAba(a).length;
          return (
            <button key={a.id} className={"aba"+(aba===a.id?' on':'')} onClick={()=>setAba(a.id)}>
              {a.nome}{n>0 && <span className="n">{n}</span>}
            </button>
          );
        })}
      </div>

      <Filtros cfg={cfg} f={f} setF={setF} busca={busca} setBusca={setBusca}
        naAba={naAba} filtrando={filtrando} aoLimpar={()=>{ setF(FILTRO_VAZIO); setBusca(''); }} />
      {vis.length===0
        ? <div className="empty">{filtrando ? 'Nenhum comentário corresponde ao que você filtrou.' : abaAtual.vazio}</div>
        : vis.map(it=><Linha key={it.id} it={it} cfg={cfg} onCampo={onCampo} onGerarResposta={onGerarResposta} onExcluir={onExcluir} />)}
    </div>
  );
}

/* ============================================================
   IMPORTAÇÃO DE PLANILHAS (helpers de parse + módulo Importar)
   ============================================================ */
function norm(t){
  return String(t||'').toLowerCase().replace(/\n/g,' ')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
}
function num(v){
  if(v===null||v===undefined||v==='') return null;
  if(typeof v==='number') return v;
  const n = parseFloat(String(v).replace(/\./g,'').replace(',','.'));
  return isNaN(n)?null:n;
}
function toDate(v){
  if(!v) return null;
  if(v instanceof Date) return v.toISOString().slice(0,10);
  const t = String(v).trim();
  let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return null;
}
function acharCabecalho(linhas, chave){
  for(let i=0;i<Math.min(linhas.length,12);i++){
    const l = (linhas[i]||[]).map(norm);
    if(l.some(c=>c.includes(chave))) return i;
  }
  return -1;
}
function mapaColunas(header){
  const m = {};
  header.forEach((h,i)=>{
    const n = norm(h); if(!n) return;
    const pago = n.includes('pago') || n.includes('paga');
    const suf = pago ? '_pago' : '_org';
    if(n.startsWith('data')) m.data=i;
    else if(n.includes('link')) m.link=i;
    else if(n==='veiculo') m.veiculo=i;
    else if(n==='formato') m.formato=i;
    else if(n==='produto') m.produto=i;
    else if(n==='editoria') m.editoria=i;
    else if(n.includes('statu')) m.status=i;
    else if(n.includes('visualizac')) m['visu'+suf]=i;
    else if(n.includes('alcance')) m['alcance'+suf]=i;
    else if(n.includes('curtida')) m['curtidas'+suf]=i;
    else if(n.includes('comentario')) m['coment'+suf]=i;
    else if(n.includes('compartilha')) m['compart'+suf]=i;
    else if(n.includes('salvamento')) m['salvos'+suf]=i;
    else if(n.includes('engajamento total')) m['engaj'+suf]=i;
    else if(n.includes('taxa')) m['tx_engaj'+suf]=i;
  });
  return m;
}

function Importar({clienteId, cfg, onFim}){
  const [busy, setBusy] = useState(false);
  const [rel, setRel] = useState(null);

  function acharId(lista, nome){
    const n = norm(nome);
    const hit = lista.find(x=>norm(x.nome)===n);
    return hit ? hit.id : null;
  }
  async function garantir(tabela, lista, nome, novos){
    if(!nome) return null;
    let id = acharId(lista, nome);
    if(id) return id;
    const { data, error } = await sb.from(tabela).insert({cliente_id:clienteId, nome:String(nome).trim()}).select().single();
    if(error) return null;
    lista.push(data); novos.push(String(nome).trim());
    return data.id;
  }

  async function processar(file){
    setBusy(true); setRel(null);
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      const redes = [...cfg.redes], produtos=[...cfg.produtos], editorias=[...cfg.editorias];
      const sents = cfg.sentimentos;
      const novosProd=[], novasEd=[], novasRedes=[];
      let posts=0, dms=0, puladas=0;
      const detalhes=[];

      for(const sn of wb.SheetNames){
        const linhas = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:false, cellDates:true, defval:''});
        const n = norm(sn);

        // ---------- PUBLICAÇÕES ----------
        if(n.startsWith('resultados')){
          const hi = acharCabecalho(linhas, 'formato');
          if(hi<0) continue;
          const cols = mapaColunas(linhas[hi]);
          let conta=0;
          for(let i=hi+1;i<linhas.length;i++){
            const L = linhas[i]; if(!L) continue;
            const data = toDate(L[cols.data]);
            if(!data) continue;
            const redeNome = L[cols.veiculo];
            const rid = await garantir('redes', redes, redeNome, novasRedes);
            const pid = await garantir('produtos', produtos, L[cols.produto], novosProd);
            const eid = await garantir('editorias', editorias, L[cols.editoria], novasEd);
            const rec = { cliente_id:clienteId, rede_id:rid, produto_id:pid, editoria_id:eid,
              data_post:data, link:L[cols.link]||null, formato:L[cols.formato]||null, status:L[cols.status]||null };
            for(const k of ['visu','alcance','curtidas','coment','compart','salvos','engaj','tx_engaj'])
              for(const suf of ['_org','_pago'])
                rec[k+suf] = cols[k+suf]!==undefined ? num(L[cols[k+suf]]) : null;
            const { error } = await sb.from('publicacoes').insert(rec);
            if(error) puladas++; else { posts++; conta++; }
          }
          if(conta) detalhes.push(conta+' publicações de '+sn.replace(/^Resultados\s*/i,''));
        }

        // ---------- DMs ----------
        if(n.startsWith('dms')){
          const hi = acharCabecalho(linhas, 'mensagem recebida');
          if(hi<0) continue;
          const H = linhas[hi].map(norm);
          const idx = k => H.findIndex(h=>h.includes(k));
          const cData=idx('data'), cVeic=idx('veiculo'), cUser=idx('usuario'), cProd=idx('produto'),
                cSent=idx('sentimento'), cMsg=idx('mensagem recebida'), cResp=idx('resposta cm'), cStat=idx('statu');
          let conta=0;
          for(let i=hi+1;i<linhas.length;i++){
            const L = linhas[i]; if(!L) continue;
            const msg = cMsg>=0 ? String(L[cMsg]||'').trim() : '';
            if(!msg) continue;
            const rid = await garantir('redes', redes, L[cVeic], novasRedes);
            const pid = await garantir('produtos', produtos, L[cProd], novosProd);
            const sNome = norm(L[cSent]);
            const sHit = sents.find(x=>norm(x.nome)===sNome);
            const resposta = cResp>=0 ? String(L[cResp]||'').trim() : '';
            const st = cStat>=0 ? norm(L[cStat]) : '';
            const rec = { cliente_id:clienteId, rede_id:rid, produto_id:pid, origem:'DM',
              sentimento_id: sHit?sHit.id:null, autor: cUser>=0?String(L[cUser]||'').trim()||null:null,
              texto: msg, resposta: resposta||null,
              triagem: (st.includes('respondido')||resposta) ? 'Respondido' : 'Pendente',
              data_publicacao: toDate(L[cData]) };
            const { error } = await sb.from('interacoes').insert(rec);
            if(error) puladas++; else { dms++; conta++; }
          }
          if(conta) detalhes.push(conta+' DMs de "'+sn.trim()+'"');
        }
      }

      setRel({posts, dms, puladas, detalhes, novosProd, novasEd, novasRedes});
      onFim();
    }catch(e){
      setRel({erro: e.message||String(e)});
    }
    setBusy(false);
  }

  return (
    <div>
      <div className="head">
        <div><h1>Importar dados</h1><p>Suba a planilha de publicações ou a de DMs. O MUVUCA lê as abas sozinho.</p></div>
      </div>
      <label className="drop" style={{display:'block'}}>
        <input type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}}
          onChange={e=>{ const f=e.target.files[0]; if(f) processar(f); e.target.value=''; }} disabled={busy} />
        <b>{busy ? 'Importando…' : 'Clique aqui para escolher a planilha'}</b>
        <span>Aceita .xlsx e .csv — abas "Resultados…" viram publicações, abas "DMs…" viram interações.</span>
      </label>

      {rel && rel.erro && <div className="log"><h3>Não consegui ler</h3><p style={{fontSize:13,color:'#A3241C'}}>{rel.erro}</p></div>}

      {rel && !rel.erro && (
        <div className="log">
          <h3>Importação concluída ✅</h3>
          <ul>
            <li><b>{rel.posts}</b> publicações importadas</li>
            <li><b>{rel.dms}</b> DMs importadas</li>
            {rel.detalhes.map((d,i)=><li key={i}>{d}</li>)}
            {rel.puladas>0 && <li>{rel.puladas} linha(s) não puderam ser gravadas</li>}
          </ul>
          {(rel.novosProd.length>0 || rel.novasEd.length>0 || rel.novasRedes.length>0) && (
            <div className="aviso">
              <b>⚠️ Nomes novos criados</b> — confira se não é erro de digitação:<br/>
              {rel.novasRedes.length>0 && <>Redes: {rel.novasRedes.join(', ')}<br/></>}
              {rel.novosProd.length>0 && <>Produtos: {rel.novosProd.join(', ')}<br/></>}
              {rel.novasEd.length>0 && <>Editorias: {rel.novasEd.join(', ')}</>}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   SHELL DA APLICAÇÃO (Painel, Gate de perfil e App raiz)
   ============================================================ */
function Painel({user, perfil, onSair}){
  const [status, setStatus] = useState('loading');
  const [erro, setErro] = useState('');
  const [clientes, setClientes] = useState([]);
  const [clienteId, setClienteId] = useState(null);
  const [cfg, setCfg] = useState({redes:[],produtos:[],editorias:[],sentimentos:[]});
  const [interacoes, setInteracoes] = useState([]);
  const [publicacoes, setPublicacoes] = useState([]);
  const [modulo, setModulo] = useState('projetos');

  useEffect(()=>{
    (async()=>{
      try{
        const {data,error} = await sb.from('clientes').select('*').order('id');
        if(error) throw error;
        setClientes(data||[]);
        if(data && data.length) setClienteId(data[0].id); else setStatus('ready');
      }catch(e){ setErro(e.message||String(e)); setStatus('erro'); }
    })();
  },[]);

  useEffect(()=>{ if(clienteId) carregar(clienteId); },[clienteId]);

  async function carregar(cid){
    setStatus('loading');
    try{
      const [r,p,e,s,i,pb] = await Promise.all([
        sb.from('redes').select('*').eq('cliente_id',cid).order('nome'),
        sb.from('produtos').select('*').eq('cliente_id',cid).order('nome'),
        sb.from('editorias').select('*').eq('cliente_id',cid).order('nome'),
        sb.from('categorias_sentimento').select('*').eq('cliente_id',cid).order('id'),
        sb.from('interacoes').select('*').eq('cliente_id',cid).order('id',{ascending:false}),
        sb.from('publicacoes').select('*').eq('cliente_id',cid).order('data_post',{ascending:false}),
      ]);
      for(const x of [r,p,e,s,i]) if(x.error) throw x.error;
      setCfg({redes:r.data||[],produtos:p.data||[],editorias:e.data||[],sentimentos:s.data||[]});
      setInteracoes(i.data||[]);
      setPublicacoes(pb.error ? [] : (pb.data||[]));
      setStatus('ready');
    }catch(ex){ setErro(ex.message||String(ex)); setStatus('erro'); }
  }

  async function onCampo(id, campo, valor){
    const {error} = await sb.from('interacoes').update({[campo]:valor}).eq('id',id);
    if(error){ alert('Erro ao salvar: '+error.message); return; }
    setInteracoes(prev=>prev.map(x=>x.id===id?{...x,[campo]:valor}:x));
  }
  /* Apaga o comentário do banco de vez. É o ÚNICO lugar do MUVUCA que destrói
     dado, e só se chega aqui por dentro da Lixeira e depois de confirmar na
     tela — dois passos de propósito. */
  async function onExcluir(id){
    const {error} = await sb.from('interacoes').delete().eq('id', id);
    if(error){ alert('Erro ao excluir: '+error.message); return; }
    setInteracoes(prev => prev.filter(x => x.id !== id));
  }
  async function onAdd(payload){
    const {data,error} = await sb.from('interacoes').insert(payload).select().single();
    if(error){ alert('Erro ao adicionar: '+error.message); return false; }
    setInteracoes(prev=>[data,...prev]);
    return true;
  }
  // Lote: uma única inserção. Se qualquer linha falhar, o Postgres desfaz
  // todas — melhor do que gravar metade e deixar o usuário sem saber quais.
  async function onAddLote(payloads){
    if(!payloads.length) return false;
    const {data,error} = await sb.from('interacoes').insert(payloads).select();
    if(error){ alert('Erro ao adicionar o lote: '+error.message+'\nNenhum comentário foi salvo.'); return false; }
    setInteracoes(prev=>[...(data||[]).slice().reverse(), ...prev]);
    return true;
  }

  /* Classifica em lotes de 4. Regra fundamental: o humano sempre vence — só
     preenchemos campo que está vazio, nunca sobrescrevemos o que alguém editou.
     A triagem não é tocada: no MUVUCA ela é estado de trabalho
     (Pendente/Respondido), não recomendação da IA. */
  async function onClassificar(alvos, aoProgredir){
    const TAM = 4;
    let ok = 0, falhas = 0, juridico = 0, entrada = 0, saida = 0, erro = '';

    for(let i = 0; i < alvos.length; i += TAM){
      const lote = alvos.slice(i, i + TAM);
      try {
        const resp = await fetch('/api/classify', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            cliente: clienteNome,
            batch: lote.map(it => ({id: it.id, autor: it.autor, texto: it.texto}))
          })
        });
        if(!resp.ok){
          let msg = 'Falha na classificação ('+resp.status+')';
          try { const j = await resp.json(); if(j.error) msg = j.error; } catch(e){}
          throw new Error(msg);
        }
        const {results, uso} = await resp.json();
        if(uso){ entrada += uso.input_tokens || 0; saida += uso.output_tokens || 0; }

        for(const it of lote){
          const r = (results || []).find(x => x.i === it.id);
          if(!r){ falhas++; continue; }
          if(r.needsLegal) juridico++;

          const mud = {};
          if(!it.sentimento_id){
            const sid = idPorNome(cfg.sentimentos, r.sentimento);
            if(sid) mud.sentimento_id = sid;
          }
          if(!it.produto_id){
            const nome = PRODUTO_DA_IA[semAcento(r.produto)];
            const pid = nome ? idPorNome(cfg.produtos, nome) : null;
            if(pid) mud.produto_id = pid;
          }
          if(!String(it.resposta || '').trim() && r.rascunho) mud.resposta = r.rascunho;

          // Carimbo de "a IA já analisou este comentário". Gravado SEMPRE,
          // inclusive quando não houve nada a preencher — era justamente esse
          // caso (produto "nenhum", spam sem rascunho) que devolvia o
          // comentário para a fila e fazia pagar de novo pelo mesmo trabalho.
          // Por isso não existe mais atalho de "nada mudou, pula o update".
          mud.ia_em = new Date().toISOString();

          // O que a IA devolve e o MUVUCA descartava. São informativos: dizem
          // o que ela achou e por quê, sem mexer em nenhuma decisão sua.
          //
          // ia_triagem é a RECOMENDAÇÃO dela (responder / curtir / não
          // responder) e mora em campo próprio de propósito: a coluna
          // "triagem" do MUVUCA é o seu estado de trabalho (Pendente /
          // Respondido / Ignorar), e gravar por cima apagaria esse estado.
          if(r.triagem)  mud.ia_triagem = r.triagem;
          if(r.motivo)   mud.ia_motivo  = r.motivo;
          mud.ia_juridico = !!r.needsLegal;
          const {error} = await sb.from('interacoes').update(mud).eq('id', it.id);
          if(error){ falhas++; continue; }
          setInteracoes(prev => prev.map(x => x.id === it.id ? {...x, ...mud} : x));
          ok++;
        }
      } catch(e){
        falhas += lote.length;
        if(!erro) erro = String(e.message || e);
      }
      if(aoProgredir) aoProgredir(Math.min(i + TAM, alvos.length));
    }

    const custoReal = ((entrada/1e6)*PRECO_ENTRADA + (saida/1e6)*PRECO_SAIDA).toFixed(4);
    return {ok, falhas, juridico, erro, custoReal, tokens: (entrada||saida) ? {entrada, saida} : null};
  }

  /* "Gerar de novo", de um comentário só. Diferente do lote de propósito: o
     lote só preenche o que está vazio, e aqui o pedido é explicitamente para
     REFAZER — quem clica está dizendo que não gostou do rascunho atual. Por
     isso a resposta é sobrescrita.

     Sentimento, produto e editoria continuam intocados: esses o usuário pode
     ter corrigido à mão, e o clique foi no botão da resposta, não neles. */
  async function onGerarResposta(it){
    try {
      const resp = await fetch('/api/classify', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          cliente: clienteNome,
          batch: [{id: it.id, autor: it.autor, texto: it.texto}]
        })
      });
      if(!resp.ok){
        let msg = 'Falha ao gerar ('+resp.status+')';
        try { const j = await resp.json(); if(j.error) msg = j.error; } catch(e){}
        return {erro: msg};
      }
      const {results} = await resp.json();
      const r = (results || [])[0];
      if(!r) return {erro: 'A IA não devolveu resposta para este comentário.'};
      if(!r.rascunho) return {erro: 'A IA entendeu que este comentário não pede resposta (' + (r.motivo || r.triagem || 'sem motivo') + ').'};

      const mud = {
        resposta: r.rascunho,
        ia_em: new Date().toISOString(),
        ia_juridico: !!r.needsLegal,
      };
      if(r.triagem) mud.ia_triagem = r.triagem;
      if(r.motivo)  mud.ia_motivo  = r.motivo;

      const {error} = await sb.from('interacoes').update(mud).eq('id', it.id);
      if(error) return {erro: 'Não consegui salvar: ' + error.message};
      setInteracoes(prev => prev.map(x => x.id === it.id ? {...x, ...mud} : x));
      return {ok: true};
    } catch(e){
      return {erro: String(e.message || e)};
    }
  }

  async function novoCliente(nome){
    const { data, error } = await sb.from('clientes').insert({nome}).select().single();
    if(error){ alert('Erro ao criar cliente: '+error.message); return; }
    const cid = data.id;
    const seeds = [];
    for(const r of ['Instagram','Facebook','TikTok','YouTube','Spotify']) seeds.push(sb.from('redes').insert({cliente_id:cid, nome:r}));
    const sents = [['Positivo','#7AC943'],['Negativo','#E63329'],['Neutro','#F5A623'],['Dúvida','#3FA9F5'],['Bot','#B8B8B8'],['Político','#111111']];
    for(const [n,c] of sents) seeds.push(sb.from('categorias_sentimento').insert({cliente_id:cid, nome:n, cor:c}));
    await Promise.all(seeds);
    setClientes(prev=>[...prev, data]);
    setClienteId(cid);
  }

  const clienteNome = clientes.find(c=>c.id===clienteId)?.nome || '';
  const displayNome = perfil?.nome || user.email;

  return (
    <div className="app">
      <aside className="side">
        <div className="logo"><div className="tile">M</div><b>muvuca</b></div>
        <div className="switcher">
          <label>Cliente</label>
          <select value={clienteId||''} onChange={e=>setClienteId(Number(e.target.value))}>
            {clientes.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
          </select>
        </div>
        {MODULOS.map(m=>(
          <button key={m.id} className={"nav"+(modulo===m.id?" on":"")} onClick={()=>setModulo(m.id)}>
            <Icon name={m.id}/>{m.nome}
          </button>
        ))}
        <div className="foot">
          <div className="who">
            <div className="av">{iniciais(displayNome)}</div>
            <div className="id"><div className="nm">{displayNome}</div><div className="em">{perfil?.cargo || user.email}</div></div>
          </div>
          <button className="linkbtn" onClick={onSair}>Sair</button>
        </div>
      </aside>
      <main className="main">
        {status==='erro'
          ? <div><div className="head"><div><h1>Ops</h1></div></div><div className="soon">{erro}</div></div>
          : status==='loading'
            ? <div className="empty">Carregando…</div>
            : modulo==='projetos'
              ? <Projetos clientes={clientes} clienteId={clienteId} setClienteId={setClienteId} cfg={cfg} interacoes={interacoes} publicacoes={publicacoes} onNovoCliente={novoCliente} irPara={setModulo} />
            : modulo==='manha'
              ? <Manha clienteId={clienteId} clienteNome={clienteNome} />
            : modulo==='aprovacoes'
              ? <Aprovacoes clienteId={clienteId} clienteNome={clienteNome} cfg={cfg} perfil={perfil} />
            : modulo==='upload'
              ? <Importar clienteId={clienteId} cfg={cfg} onFim={()=>carregar(clienteId)} />
            : modulo==='community'
              ? <Community cfg={cfg} interacoes={interacoes} clienteId={clienteId} clienteNome={clienteNome} onCampo={onCampo} onAdd={onAdd} onAddLote={onAddLote} onClassificar={onClassificar} onGerarResposta={onGerarResposta} onExcluir={onExcluir} />
            : modulo==='conteudos'
              ? <Conteudos cfg={cfg} publicacoes={publicacoes} interacoes={interacoes} clienteNome={clienteNome} />
            : modulo==='relatorios'
              ? <Dashboard cfg={cfg} interacoes={interacoes} clienteNome={clienteNome} />
              : <div>
                  <div className="head"><div><h1>{MODULOS.find(m=>m.id===modulo).nome}</h1><p>{clienteNome}</p></div></div>
                  <div className="soon">Módulo em construção — vem depois do Community, reaproveitando este mesmo esqueleto.</div>
                </div>}
      </main>
    </div>
  );
}

function Gate({user, onSair}){
  const [perfil, setPerfil] = useState(undefined);
  const [erro, setErro] = useState('');
  async function carregarPerfil(){
    try{
      const { data, error } = await sb.from('perfis').select('*').eq('id', user.id).maybeSingle();
      if(error) throw error;
      setPerfil(data || null);
    }catch(e){ setErro(e.message||String(e)); }
  }
  useEffect(()=>{ carregarPerfil(); },[user.id]);
  if(erro) return (
    <div className="auth">
      <h1>Ops</h1>
      <p className="sub">{erro}</p>
      <p style={{fontSize:13,color:'var(--muted)'}}>Se falar em "perfis", rode o SQL da tabela de perfis no Supabase e recarregue a página.</p>
      <button className="btn" onClick={onSair}>Sair</button>
    </div>
  );
  if(perfil===undefined) return <div className="empty" style={{paddingTop:'22vh'}}>Carregando…</div>;
  if(!perfil || !perfil.onboarded) return <Onboarding user={user} onDone={carregarPerfil} />;
  return <Painel user={user} perfil={perfil} onSair={onSair} />;
}

function App(){
  const [session, setSession] = useState(undefined);
  // O link enviado por email volta para cá com "type=recovery" no endereço.
  // Nesse caso mostramos a tela de nova senha em vez de entrar direto no painel.
  const [recuperando, setRecuperando] = useState(()=> window.location.hash.includes('type=recovery'));
  useEffect(()=>{
    sb.auth.getSession().then(({data})=> setSession(data.session || null));
    const { data } = sb.auth.onAuthStateChange((evento, s)=>{
      if(evento==='PASSWORD_RECOVERY') setRecuperando(true);
      setSession(s);
    });
    return ()=>{ data.subscription.unsubscribe(); };
  },[]);
  if(session===undefined) return <div className="empty" style={{paddingTop:'22vh'}}>Carregando…</div>;
  if(recuperando && session) return <NovaSenha onPronto={()=>setRecuperando(false)} />;
  if(!session) return <Auth/>;
  return <Gate user={session.user} onSair={()=>sb.auth.signOut()} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
